  # ============================================
  # E2E Tests
  # ============================================
  e2e-tests:
    # needs: check-prerequisites
    # if: needs.check-prerequisites.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      fail-fast: false  # 1つのテストが失敗しても他のテストを続行
      max-parallel: 5   # 同時に実行するテストは最大5個まで
      matrix:
        test-suite:
          - "chat"
          - "rag"
          - "create-idea"
          - "create-minutes"
          - "create-mail"
          - "reply-mail"
          - "company-analysis"
          - "corporate-survey"
          - "summary"
          - "translation"
          - "text-correction"
          - "supposed-question"
          - "talk-script"
          - "create-prompt"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-e2e-${{ hashFiles('frontend/tests/E2E/requirements.txt') }}

      - name: Install Python dependencies
        working-directory: ${{ env.E2E_TEST_DIR }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install Playwright browsers
        run: |
          playwright install chromium --with-deps

      - name: Restore authentication state
        run: |
          mkdir -p ${{ env.E2E_TEST_DIR }}/features/temp
          echo '${{ env.E2E_AUTH_STATE }}' > ${{ env.E2E_TEST_DIR }}/features/temp/auth_state.json
          echo "✓ Authentication state restored"

      - name: Update test configuration
        run: |
          # プレビュー環境URLを取得（Secret > デフォルト）
          PREVIEW_URL="${{ env.E2E_PREVIEW_URL }}"
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL="${{ env.E2E_DEFAULT_URL }}"
          fi
          
          echo "Testing against: $PREVIEW_URL"
          echo "E2E_TARGET_URL=$PREVIEW_URL" >> $GITHUB_ENV
          
          # config.pyのBASE_URLを動的に更新
          sed -i "s|^BASE_URL = .*|BASE_URL = \"$PREVIEW_URL\"|g" ${{ env.E2E_TEST_DIR }}/features/util/config.py
          
          # 設定確認（BASE_URLとPROXY_CONFIG）
          echo "Updated config.py:"
          grep "BASE_URL" ${{ env.E2E_TEST_DIR }}/features/util/config.py
          grep -A 2 "PROXY_CONFIG" ${{ env.E2E_TEST_DIR }}/features/util/config.py

      - name: Run E2E test - ${{ matrix.test-suite }}
        working-directory: ${{ env.E2E_TEST_DIR }}
        env:
          MANUAL_AUTH: "false"  # 認証状態を使用するため手動認証は不要
          HEADLESS: "true"      # ヘッドレスモードで実行
        run: |
          set -e
          set -o pipefail
          START_TIME=$(date +%s)
          echo "SUITE_NAME=${{ matrix.test-suite }}" >> $GITHUB_ENV
          
          # テストファイル名を構築
          TEST_FILE="features/source/${{ matrix.test-suite }}.py"
          
          if [ -f "$TEST_FILE" ]; then
            echo "Running E2E test: ${{ matrix.test-suite }}"
            pytest "$TEST_FILE" \
              --verbose \
              --tb=short \
              --junitxml=test-results-${{ matrix.test-suite }}.xml 2>&1 | tee test-output-${{ matrix.test-suite }}.log
            
            # pytestが成功した場合のみ実行時間を記録
            END_TIME=$(date +%s)
            DURATION=$((END_TIME - START_TIME))
            echo "Test duration for ${{ matrix.test-suite }}: ${DURATION}s"
            echo "E2E_DURATION=${DURATION}" >> $GITHUB_ENV
            echo "E2E_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "Test file not found: $TEST_FILE"
            echo "E2E_DURATION=0" >> $GITHUB_ENV
            echo "E2E_SUCCESS=skipped" >> $GITHUB_ENV
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.test-suite }}
          path: |
            ${{ env.E2E_TEST_DIR }}/test-results-${{ matrix.test-suite }}.xml
            ${{ env.E2E_TEST_DIR }}/test-output-${{ matrix.test-suite }}.log

      - name: Upload evidence (screenshots and logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ matrix.test-suite }}
          path: |
            ${{ env.E2E_TEST_DIR }}/features/evidence/
          retention-days: 7

      - name: Clean up authentication state
        if: always()
        run: |
          rm -f ${{ env.E2E_TEST_DIR }}/features/temp/auth_state.json
          echo "✓ Authentication state cleaned up"

