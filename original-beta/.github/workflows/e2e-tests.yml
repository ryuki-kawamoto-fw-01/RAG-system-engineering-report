# ============================================
# E2E Test Pipeline - 使い方ガイド
# ============================================
#
# 【概要】
# フロントエンドのE2Eテストを自動実行するワークフローです。
# PlaywrightとPytestを使用して、14種類の機能をブラウザで自動テストします。
#
# 【トリガー条件】
# - フロントエンドとバックエンドのテストが両方成功した後に自動実行
#   - Frontend Test Pipelineが成功 かつ
#   - Backend Test Pipelineが成功
#   → 両方が成功して初めてE2Eテストを実行（時間とリソースを節約）
#
# 【必要なGitHub Secrets】
# - E2E_AUTH_STATE (必須)
#   説明: Azure Entra ID認証後の認証状態（Cookie、localStorage等）をJSON形式で保存
#   取得方法:
#     1. ローカルで以下を実行:
#        $env:MANUAL_AUTH="true"
#        pytest frontend\tests\E2E\features\source\chat.py::test_chat_features -v -s
#     2. 生成されたファイルの内容をコピー:
#        Get-Content frontend\tests\E2E\features\temp\auth_state.json | Set-Clipboard
#     3. GitHub Settings → Secrets → E2E_AUTH_STATE に貼り付け
#
# - E2E_PREVIEW_URL (オプション)
#   説明: テスト対象のURL（指定しない場合はE2E_DEFAULT_URLが使用される）
#   例: https://frontend-preview-pr123.azurewebsites.net
#
# 【必要な権限】
# このワークフローには以下の権限が必要です（すでに設定済み）:
# - contents: read （コードのチェックアウト用）
# - pull-requests: write （PRへのコメント用）
# - checks: write （テスト結果の報告用）
# - actions: read （他のワークフロー状態の確認用）
#
# 【テスト対象】
# 全14種類の機能:
#   - chat: チャット機能（16ステップ）
#   - rag: 文書検索（26ステップ）
#   - create-idea: アイデア作成（11ステップ）
#   - create-minutes: 議事録作成（12ステップ）
#   - create-mail: メール作成（9ステップ）
#   - reply-mail: 返信メール作成（10ステップ）
#   - company-analysis: 企業分析（11ステップ）
#   - corporate-survey: 企業調査（10ステップ）
#   - summary: 要約（11ステップ）
#   - translation: 翻訳（10ステップ）
#   - text-correction: 文章校正（12ステップ）
#   - supposed-question: 想定質問（13ステップ）
#   - talk-script: トークスクリプト（13ステップ）
#   - create-prompt: プロンプト作成
#
# 【動作フロー】
# 1. プルリクエスト作成/更新
#    ↓
# 2. Frontend Test Pipeline と Backend Test Pipeline が並列実行
#    ↓
# 3. 両方のワークフローが成功した時点でE2E Test Pipelineが自動開始
#    ※片方でも失敗した場合、E2Eテストはスキップされます
#    ※最初に完了したワークフローがトリガーしますが、前提条件チェックで両方の成功を確認します
#
# 【トラブルシューティング】
# - 認証エラーが発生: E2E_AUTH_STATEが期限切れの可能性があるため、再取得して更新
# - テストが失敗: Artifactsからevidenceフォルダのスクリーンショットを確認
# - E2Eテストが実行されない: 
#   → フロントエンドとバックエンドのテストが両方成功しているか確認
#   → check-prerequisitesジョブのログで詳細を確認
# - E2Eテストが重複実行される:
#   → concurrency設定により、同じコミットに対する重複実行は自動的に防がれます
#
# 【ワークフロー名の変更方法】
# フロントエンドまたはバックエンドのワークフローを変更する場合、以下の3箇所を更新:
# 1. env.FRONTEND_WORKFLOW_FILE または env.BACKEND_WORKFLOW_FILE（ファイル名）
# 2. workflow_run.workflows配列（ワークフロー名 = 各ワークフローのname:フィールド）
#    - 現在: "Frontend Test Pipeline" と "Backend Test Pipeline"
# 注意: workflow_runではワークフロー名を、gh run listではファイル名を使用します
#
# 【参考ドキュメント】
# - E2Eテスト詳細: frontend/tests/E2E/features/README.md
# - 認証状態管理: frontend/tests/E2E/features/util/manage_auth.py
#
# ============================================

name: E2E Test Pipeline

on:
  push:
    branches:
      - feature/XXX
    paths:
    - 'infra/tenant/**/trial/**' # infra/tenant/{テナント名}/trial/ 以下の変更をトリガー

  # # フロントエンドまたはバックエンドのテストワークフローが成功した後に実行
  # workflow_run:
  #   workflows: 
  #     - "Frontend Test Pipeline"
  #     - "Backend Test Pipeline"
  #   types:
  #     - completed
  #   branches: [feature/xxx]

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read  # 他のワークフロー状態の確認に必要

# # 同じコミットに対するE2Eテストの重複実行を防ぐ
# concurrency:
#   group: e2e-tests-${{ github.event.workflow_run.head_sha }}
#   cancel-in-progress: false  # 実行中のテストをキャンセルせず、重複を防ぐ

env:
  # E2E Test settings
  PYTHON_VERSION: "3.12"
  E2E_TEST_DIR: frontend/tests/E2E
  # Authentication settings
  E2E_AUTH_STATE: ${{ secrets.TRIAL97_E2E_AUTH_STATE }}
  E2E_PREVIEW_URL: ${{ secrets.TRIAL97_E2E_PREVIEW_URL }}
  # Default test target URL (fallback if secret is not set)
  E2E_DEFAULT_URL: "https://frontend-hr-ateam-14-fqahaudqdydsc3dn.japaneast-01.azurewebsites.net"
  # Workflow names (central configuration - update here if workflow names change)
  FRONTEND_WORKFLOW_FILE: "frontend-tests.yml"
  BACKEND_WORKFLOW_FILE: "backend-tests.yml"

