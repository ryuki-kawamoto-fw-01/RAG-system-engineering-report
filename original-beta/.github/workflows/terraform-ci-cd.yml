name: CI/CD Pipeline (Infra + Frontend + Backend)

on:
  push:
    branches:
      - feature/SRE-7-IaC
    paths:
    - 'infra/tenant/**/trial/**' # infra/tenant/{テナント名}/trial/ 以下の変更をトリガー
  workflow_dispatch: # 手動実行を有効化


permissions:
  contents: read
  id-token: write

env:
  # Terraform settings
  TF_VERSION: "1.14.3"
  WORKDIR_CORE: infra/tenant/hisys/trial/core
  WORKDIR_AI: infra/tenant/hisys/trial/ai_service
  ARM_CLIENT_ID: ${{ secrets.TRIALhs_ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.TRIALhs_ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.TRIALhs_ARM_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  # Frontend Authentication settings
  FRONTEND_AUTH_CLIENT_ID: ${{ secrets.TRIALhs_FRONTEND_AUTH_CLIENT_ID }}
  FRONTEND_AUTH_CLIENT_SECRET: ${{ secrets.TRIALhs_FRONTEND_AUTH_CLIENT_SECRET }}
  # Azure AI Search Schema settings
  SCHEMAS_DIR: infra/tenant/hisys/trial/ai_service/schemas
  # Deployment control flags (set to 'true' to skip for faster iteration)

jobs:
  # ============================================
  # Infrastructure (Terraform) Jobs
  # ============================================
  terraform-plan-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: trial
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # # ============================================
      # # 初回構築判定: Terraform Stateが存在しないことを確認
      # # ============================================
      # - name: Check if this is initial deployment
      #   id: check-initial
      #   run: |
      #     echo "Checking if Terraform State exists..."
          
      #     # Terraform初期化（ステート確認のため）
      #     cd ${{ env.WORKDIR_CORE }}
      #     terraform init -input=false -backend=true || {
      #       echo "Terraform init failed - assuming initial deployment"
      #       echo "is_initial=true" >> $GITHUB_OUTPUT
      #       exit 0
      #     }
          
      #     # Stateファイルの存在確認
      #     if terraform state list 2>/dev/null | grep -q .; then
      #       echo "❌ Terraform State already exists - this is NOT an initial deployment"
      #       echo "This workflow is for initial deployment only."
      #       echo "Please use terraform-infra.yml for infrastructure updates."
      #       echo "is_initial=false" >> $GITHUB_OUTPUT
      #     else
      #       echo "✅ No Terraform State found - proceeding with initial deployment"
      #       echo "is_initial=true" >> $GITHUB_OUTPUT
      #     fi

      # - name: Exit if not initial deployment
      #   if: steps.check-initial.outputs.is_initial == 'false'
      #   run: |
      #     echo "::error::This workflow is for initial deployment only. Use terraform-infra.yml for updates."
      #     exit 1

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TRIALhs_ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.TRIALhs_ARM_TENANT_ID }}
          subscription-id: ${{ secrets.TRIALhs_ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false  # terraform output -raw を使うため wrapper を無効化

      # ============================================
      # Infrastructure Deployment (CORE) - Phase 1
      # ============================================
      # init_flag=true でパブリックネットワークアクセスを有効化してインフラをデプロイ
      # この段階でアプリケーションデプロイが可能な環境を構築

      # CORE - Step 1: Plan with init_flag=true
      - name: Terraform Init (core)
        working-directory: ${{ env.WORKDIR_CORE }}
        run: terraform init -input=false -upgrade

      - name: Terraform Validate (core)
        working-directory: ${{ env.WORKDIR_CORE }}
        run: terraform validate

      # # --- 初回構築のため以下不要 ---
      # # Terraform Plan 実行前に既存 Storage Account のネットワークルールを一時的に開放
      # # （既存リソースの状態確認のため）
      # # Terraform init後、既存のステートから値を取得
      # - name: Get Storage Account and Resource Group names from Terraform
      #   id: get-storage-info
      #   working-directory: ${{ env.WORKDIR_CORE }}
      #   run: |
      #     # 既存のステートファイルから値を取得（存在する場合）
      #     echo "Checking for existing Terraform outputs..."
      #     STORAGE_ACCOUNT_NAME=$(terraform output -raw storage_account_name 2>/dev/null || echo "")
      #     RESOURCE_GROUP=$(terraform output -raw resource_group_name 2>/dev/null || echo "")
          
      #     if [ -n "$STORAGE_ACCOUNT_NAME" ] && [ -n "$RESOURCE_GROUP" ]; then
      #       echo "✅ Found existing Terraform state:"
      #       echo "  Storage Account: $STORAGE_ACCOUNT_NAME"
      #       echo "  Resource Group: $RESOURCE_GROUP"
      #     else
      #       echo "ℹ️ No existing Terraform outputs found (likely initial deployment)"
      #       echo "  Storage Account: [not found]"
      #       echo "  Resource Group: [not found]"
      #     fi
          
      #     echo "STORAGE_ACCOUNT_NAME=$STORAGE_ACCOUNT_NAME" >> $GITHUB_ENV
      #     echo "RESOURCE_GROUP_TEMP=$RESOURCE_GROUP" >> $GITHUB_ENV

      # - name: Temporarily allow network access to Storage Account
      #   run: |
      #     echo "========================================"
      #     echo "Attempting to open Storage Account network access"
      #     echo "========================================"
          
      #     if [ -n "${{ env.STORAGE_ACCOUNT_NAME }}" ] && [ -n "${{ env.RESOURCE_GROUP_TEMP }}" ]; then
      #       echo "Storage Account: ${{ env.STORAGE_ACCOUNT_NAME }}"
      #       echo "Resource Group: ${{ env.RESOURCE_GROUP_TEMP }}"
      #       echo "Checking if Storage Account exists..."
            
      #       if az storage account show --name "${{ env.STORAGE_ACCOUNT_NAME }}" --resource-group "${{ env.RESOURCE_GROUP_TEMP }}" >/dev/null 2>&1; then
      #         echo "✅ Storage Account exists, updating network access..."
      #         az storage account update \
      #           --name "${{ env.STORAGE_ACCOUNT_NAME }}" \
      #           --resource-group "${{ env.RESOURCE_GROUP_TEMP }}" \
      #           --default-action Allow \
      #           && echo "✅ Storage Account network access enabled" \
      #           || echo "⚠️ Failed to update Storage Account network rules, continuing..."
      #       else
      #         echo "ℹ️ Storage Account does not exist yet, skipping network access configuration..."
      #       fi
      #     else
      #       echo "ℹ️ Storage Account information not available (likely initial deployment)"
      #       echo "Skipping network access configuration..."
      #     fi
      #     echo "========================================"

      - name: Terraform Plan with init_flag=true (core)
        working-directory: ${{ env.WORKDIR_CORE }}
        run: |
          echo "Verifying PDF Function App environment variables configuration..."
          echo "Content of env_vars/08-pdf.tpl:"
          cat env_vars/08-pdf.tpl
          echo ""
          terraform plan -input=false -no-color -out=tfplan_core_init \
            -var="init_flag=true" \
            -var="frontend_auth_client_id=${{ env.FRONTEND_AUTH_CLIENT_ID }}" \
            -var="frontend_auth_client_secret=${{ env.FRONTEND_AUTH_CLIENT_SECRET }}"

      # CORE - Step 2: Apply with init_flag=true
      # パブリックネットワークアクセスを有効化してインフラストラクチャをデプロイ
      - name: Terraform Apply with init_flag=true (core)
        working-directory: ${{ env.WORKDIR_CORE }}
        run: terraform apply -input=false -auto-approve -parallelism=5 tfplan_core_init

      # ============================================
      # リソース情報の取得
      # ============================================
      # パブリックネットワークアクセスが有効な状態でデプロイするため、
      # CORE Step 2 完了後にリソース情報を取得
      - name: Get resource group name from Terraform output
        id: get-resource-group
        working-directory: ${{ env.WORKDIR_CORE }}
        run: |
          RESOURCE_GROUP=$(terraform output -raw resource_group_name)
          echo "RESOURCE_GROUP=$RESOURCE_GROUP" >> $GITHUB_ENV

      - name: Get Event Grid System Topic name from Terraform output
        id: get-event-grid-topic
        working-directory: ${{ env.WORKDIR_CORE }}
        run: |
          EVENT_GRID_SYSTEM_TOPIC_NAME=$(terraform output -raw event_grid_system_topic_name)
          echo "EVENT_GRID_SYSTEM_TOPIC_NAME=$EVENT_GRID_SYSTEM_TOPIC_NAME" >> $GITHUB_ENV

      # ============================================
      # Frontend Build and Deploy
      # ============================================
      # パブリックネットワークアクセスが有効な状態（init_flag=true）で
      # フロントエンドアプリケーションをデプロイ
      # Get Frontend App Service name and Resource Group from Terraform output
      - name: Get Frontend App Service name from Terraform output
        id: get-frontend-app-name
        working-directory: ${{ env.WORKDIR_CORE }}
        run: |
          FRONTEND_APP_NAME=$(terraform output -raw frontend_app_service_name)
          echo "FRONTEND_APP_NAME=$FRONTEND_APP_NAME" >> $GITHUB_ENV

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install specific npm version
        run: npm install -g npm@10.7.0

      - name: Install frontend dependencies
        id: install-dependencies
        working-directory: frontend
        run: npm install

      - name: Format frontend code
        id: format-code
        working-directory: frontend
        run: npm run format

      - name: Lint frontend code
        id: lint-code
        working-directory: frontend
        run: npm run lint

      - name: Build frontend application
        id: build-frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_STANDARD_STORAGE_CONTAINER_NAME: genashi-trial-06
          NEXT_PUBLIC_STANDARD_PREVIEW_STORAGE_CONTAINER_NAME: genashi-trial-06
          NEXT_PUBLIC_DISABLED_ROUTE_PREFIXES: image-generation,create-manual
        run: npm run build
        continue-on-error: false

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FRONTEND_APP_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: ./frontend

      - name: Create Frontend deployment summary
        if: always()
        run: |
          echo "## Frontend Build and Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "### Set up Node.js" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ steps.setup-node.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "### Install dependencies" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ steps.install-dependencies.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "### Format code" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ steps.format-code.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "### Lint code" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ steps.lint-code.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "### Build frontend" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ steps.build-frontend.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Info" >> $GITHUB_STEP_SUMMARY
          echo "- App Name: ${{ env.FRONTEND_APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- Resource Group: ${{ env.RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY

      # ============================================
      # Load Balancer Build and Deploy
      # ============================================
      # パブリックネットワークアクセスが有効な状態（init_flag=true）で
      # Load Balancer App Service (.NET Core 8.0) をデプロイ
      - name: Get LoadBalancer App Service name from Terraform output
        id: get-loadbalancer-app-name
        working-directory: ${{ env.WORKDIR_CORE }}
        run: |
          LOADBALANCER_APP_NAME=$(terraform output -raw loadbalancer_app_service_name)
          echo "LOADBALANCER_APP_NAME=$LOADBALANCER_APP_NAME" >> $GITHUB_ENV

      - name: Set up .NET Core 8.0 for Load Balancer
        id: setup-dotnet-loadbalancer
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Load Balancer application
        id: build-loadbalancer
        working-directory: loadbalancer/openai-aca-lb/src
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet publish --configuration Release --no-build --output ./publish
        continue-on-error: false

      - name: Deploy Load Balancer to Azure Web App
        id: deploy-loadbalancer
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.LOADBALANCER_APP_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: ./loadbalancer/openai-aca-lb/src/publish

      - name: Create Load Balancer deployment summary
        if: always()
        run: |
          echo "## Load Balancer Build and Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "### Set up .NET Core" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ steps.setup-dotnet-loadbalancer.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "### Build Load Balancer" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ steps.build-loadbalancer.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "### Deploy Load Balancer" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ steps.deploy-loadbalancer.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Info" >> $GITHUB_STEP_SUMMARY
          echo "- App Name: ${{ env.LOADBALANCER_APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- Resource Group: ${{ env.RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY

      # ============================================
      # Backend Build and Deploy
      # ============================================
      # パブリックネットワークアクセスが有効な状態（init_flag=true）で
      # バックエンド Function Apps をデプロイ
      # Get Function App names from Terraform output
      - name: Get Function App names from Terraform output
        id: get-function-app-names
        working-directory: ${{ env.WORKDIR_CORE }}
        run: |
          # バックエンド処理用 Function Apps (1-8)
          FUNCTION_CHAT_NAME=$(terraform output -raw function_chat_name)
          FUNCTION_RAG_NAME=$(terraform output -raw function_rag_name)
          FUNCTION_REGISTER_NAME=$(terraform output -raw function_register_name)
          FUNCTION_PII_NAME=$(terraform output -raw function_pii_name)
          FUNCTION_PROMPT_NAME=$(terraform output -raw function_prompt_name)
          FUNCTION_MFG_NAME=$(terraform output -raw function_mfg_name)
          FUNCTION_AGENT_RAG_NAME=$(terraform output -raw function_agent_rag_name)
          FUNCTION_AGENT_DOCUMENT_NAME=$(terraform output -raw function_agent_document_name)
          
          # データ前処理用 Function Apps (9-14)
          FUNCTION_PAGESPLITER_001_NAME=$(terraform output -raw function_pagespliter_001_name)
          FUNCTION_MARKDOWN_001_NAME=$(terraform output -raw function_markdown_001_name)
          FUNCTION_PDF_NAME=$(terraform output -raw function_pdf_name)
          FUNCTION_PAGESPLITER_002_NAME=$(terraform output -raw function_pagespliter_002_name)
          FUNCTION_MARKDOWN_002_NAME=$(terraform output -raw function_markdown_002_name)
          FUNCTION_INDEXER_NAME=$(terraform output -raw function_indexer_name)
          
          echo "FUNCTION_CHAT_NAME=$FUNCTION_CHAT_NAME" >> $GITHUB_ENV
          echo "FUNCTION_RAG_NAME=$FUNCTION_RAG_NAME" >> $GITHUB_ENV
          echo "FUNCTION_REGISTER_NAME=$FUNCTION_REGISTER_NAME" >> $GITHUB_ENV
          echo "FUNCTION_PII_NAME=$FUNCTION_PII_NAME" >> $GITHUB_ENV
          echo "FUNCTION_PROMPT_NAME=$FUNCTION_PROMPT_NAME" >> $GITHUB_ENV
          echo "FUNCTION_MFG_NAME=$FUNCTION_MFG_NAME" >> $GITHUB_ENV
          echo "FUNCTION_AGENT_RAG_NAME=$FUNCTION_AGENT_RAG_NAME" >> $GITHUB_ENV
          echo "FUNCTION_AGENT_DOCUMENT_NAME=$FUNCTION_AGENT_DOCUMENT_NAME" >> $GITHUB_ENV
          echo "FUNCTION_PAGESPLITER_001_NAME=$FUNCTION_PAGESPLITER_001_NAME" >> $GITHUB_ENV
          echo "FUNCTION_MARKDOWN_001_NAME=$FUNCTION_MARKDOWN_001_NAME" >> $GITHUB_ENV
          echo "FUNCTION_PDF_NAME=$FUNCTION_PDF_NAME" >> $GITHUB_ENV
          echo "FUNCTION_PAGESPLITER_002_NAME=$FUNCTION_PAGESPLITER_002_NAME" >> $GITHUB_ENV
          echo "FUNCTION_MARKDOWN_002_NAME=$FUNCTION_MARKDOWN_002_NAME" >> $GITHUB_ENV
          echo "FUNCTION_INDEXER_NAME=$FUNCTION_INDEXER_NAME" >> $GITHUB_ENV

      - name: Set up Python 3.12 for Backend
        id: setup-python-backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ====== バックエンド処理 Functions (1-8) ======

      # バックエンド処理 Functions デプロイ前に認証トークンをリフレッシュ
      # （Frontend/Terraform Phase 1実行後の長時間経過によるトークン期限切れを防ぐため）
      - name: Azure Re-login before backend functions
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TRIALhs_ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.TRIALhs_ARM_TENANT_ID }}
          subscription-id: ${{ secrets.TRIALhs_ARM_SUBSCRIPTION_ID }}

      # ============================================
      # リソース情報の取得
      # ============================================
      # Function Apps への直接デプロイのため、Storage Account名を取得
      - name: Get Storage Account name from Terraform output
        working-directory: ${{ env.WORKDIR_CORE }}
        run: |
          # Storage Account名を取得
          STORAGE_ACCOUNT_NAME=$(terraform output -raw storage_account_name)
          echo "STORAGE_ACCOUNT_NAME=$STORAGE_ACCOUNT_NAME" >> $GITHUB_ENV
          echo "Storage Account: $STORAGE_ACCOUNT_NAME"

      # Function Apps デプロイ前に Storage Account のパブリックアクセスを一時的に有効化
      # （Managed Identity方式のFunction AppsがStorage Accountにアクセスするため）
      - name: Temporarily allow network access to Storage Account for Function Apps
        run: |
          echo "=========================================="
          echo "Opening network access for Storage Account (Function Apps deployment)"
          echo "=========================================="
          echo "Storage Account: ${{ env.STORAGE_ACCOUNT_NAME }}"
          echo "This is required for Function Apps with Managed Identity to access Storage Account"
          echo ""
          
          # Storage Accountのパブリックネットワークアクセスを有効化
          echo "Enabling public network access for Storage Account..."
          az storage account update \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --default-action Allow
          
          if [ $? -ne 0 ]; then
            echo "❌ Error: Failed to update Storage Account network settings"
            exit 1
          fi
          
          echo "✅ Storage Account network access enabled for Function Apps deployment"
          echo "=========================================="
      
      # Function 1: Chat (orchestrator)
      - name: Build Function Chat Package
        id: build-chat
        run: |
          cd backend/orchestrator
          echo "Building Function Chat..."
          rm -rf .python_packages
          pip install -r requirements.txt --target .python_packages/lib/site-packages
          ls -la .python_packages/lib/site-packages | grep 'azure'
          zip -r ../../function-chat.zip .
          cd ../..

      - name: Deploy Function Chat to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FUNCTION_CHAT_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: ./function-chat.zip

      # Function 2: RAG (orchestrator-rag)
      - name: Build Function RAG Package
        id: build-rag
        run: |
          cd backend/orchestrator-rag
          echo "Building Function RAG..."
          rm -rf .python_packages
          pip install -r requirements.txt --target .python_packages/lib/site-packages
          zip -r ../../function-rag.zip .
          cd ../..

      - name: Deploy Function RAG to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FUNCTION_RAG_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: ./function-rag.zip

      # Function 3: Register (orchestrator-text-register)
      - name: Build Function Register Package
        id: build-register
        run: |
          cd backend/orchestrator-text-register
          echo "Building Function Register..."
          rm -rf .python_packages
          pip install -r requirements.txt --target .python_packages/lib/site-packages
          ls -la .python_packages/lib/site-packages | grep 'azure'
          zip -r ../../function-register.zip .
          cd ../..

      - name: Deploy Function Register to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FUNCTION_REGISTER_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: ./function-register.zip

      # Function 4: PII (orchestrator-pii)
      - name: Build Function PII Package
        id: build-pii
        run: |
          cd backend/orchestrator-pii
          echo "Building Function PII..."
          rm -rf .python_packages
          pip install -r requirements.txt --target .python_packages/lib/site-packages
          zip -r ../../function-pii.zip .
          cd ../..

      - name: Deploy Function PII to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FUNCTION_PII_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: ./function-pii.zip

      # Function 5: Prompt (orchestrator-prompt)
      - name: Build Function Prompt Package
        id: build-prompt
        run: |
          cd backend/orchestrator-prompt
          echo "Building Function Prompt..."
          rm -rf .python_packages
          pip install -r requirements.txt --target .python_packages/lib/site-packages
          ls -la .python_packages/lib/site-packages | grep 'azure'
          zip -r ../../function-prompt.zip .
          cd ../..

      - name: Deploy Function Prompt to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FUNCTION_PROMPT_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: ./function-prompt.zip

      # Function 6: MFG (orchestrator-mfg)
      - name: Build Function MFG Package
        id: build-mfg
        run: |
          cd backend/orchestrator-mfg
          echo "Building Function MFG..."
          rm -rf .python_packages
          pip install -r requirements.txt --target .python_packages/lib/site-packages
          ls -la .python_packages/lib/site-packages | grep 'azure'
          zip -r ../../function-mfg.zip .
          cd ../..

      - name: Deploy Function MFG to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FUNCTION_MFG_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: ./function-mfg.zip

      # Function 7: Agent RAG (orchestrator-agent)
      - name: Build Function Agent RAG Package
        id: build-agent-rag
        run: |
          cd backend/orchestrator-agent
          echo "Building Function Agent RAG..."
          rm -rf .python_packages
          pip install -r requirements.txt --target .python_packages/lib/site-packages
          ls -la .python_packages/lib/site-packages | grep 'azure'
          zip -r ../../function-agent-rag.zip .
          cd ../..

      - name: Deploy Function Agent RAG to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FUNCTION_AGENT_RAG_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: ./function-agent-rag.zip

      # Function 8: Agent Document (orchestrator-text-register - same as Function 3) #中身はFunction3と同じ。環境変数のみ異なる
      - name: Build Function Agent Document Package
        id: build-agent-document
        run: |
          cd backend/orchestrator-text-register
          echo "Building Function Agent Document..."
          rm -rf .python_packages
          pip install -r requirements.txt --target .python_packages/lib/site-packages
          ls -la .python_packages/lib/site-packages | grep 'azure'
          zip -r ../../function-agent-document.zip .
          cd ../..

      - name: Deploy Function Agent Document to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FUNCTION_AGENT_DOCUMENT_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: ./function-agent-document.zip

      # ====== データ前処理 Functions (9-14) ======

      # データ前処理 Functions デプロイ前に認証トークンをリフレッシュ
      # （長時間実行後のトークン期限切れを防ぐため）
      - name: Azure Re-login before data preprocessing functions
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TRIALhs_ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.TRIALhs_ARM_TENANT_ID }}
          subscription-id: ${{ secrets.TRIALhs_ARM_SUBSCRIPTION_ID }}

      # Function 9: Pagespliter 001 (changedoc/pagesplitter)
      - name: Build Function Pagespliter 001 Package
        id: build-pagespliter-001
        run: |
          cd changedoc/pagesplitter
          echo "Building Function Pagespliter 001..."
          rm -rf .python_packages
          pip install -r requirements.txt --target .python_packages/lib/site-packages
          zip -r ../../function-pagespliter-001.zip .
          cd ../..

      - name: Deploy Function Pagespliter 001 to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FUNCTION_PAGESPLITER_001_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: ./function-pagespliter-001.zip

      # Function 10: Markdown 001 (changedoc/markdown)
      - name: Build Function Markdown 001 Package
        id: build-markdown-001
        run: |
          cd changedoc/markdown
          echo "Building Function Markdown 001..."
          rm -rf .python_packages
          pip install -r requirements.txt --target .python_packages/lib/site-packages
          zip -r ../../function-markdown-001.zip .
          cd ../..

      - name: Deploy Function Markdown 001 to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FUNCTION_MARKDOWN_001_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: ./function-markdown-001.zip

      # Function 11: PDF (changedoc/converttopdf) - Dockerコンテナイメージ使用
      # PDF Function AppのみDockerコンテナイメージを使用
      # トークン切れを防ぐため、Azure Loginを再度実行してからACRへのログインとイメージのビルド・プッシュを行う
      - name: Re-authenticate to Azure for ACR access
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TRIALhs_ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.TRIALhs_ARM_TENANT_ID }}
          subscription-id: ${{ secrets.TRIALhs_ARM_SUBSCRIPTION_ID }}

      - name: Get Container Registry name from Terraform output
        id: get-acr-name
        working-directory: ${{ env.WORKDIR_CORE }}
        run: |
          ACR_NAME=$(terraform output -raw container_registry_name)
          echo "ACR_NAME=$ACR_NAME" >> $GITHUB_ENV

      # Function Appが以前の失敗でBlocked状態になっている可能性があるため、停止して設定をクリア
      - name: Stop PDF Function App to clear blocked state
        run: |
          echo "Stopping PDF Function App to clear any blocked state and old configuration..."
          az functionapp stop \
            --name ${{ env.FUNCTION_PDF_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }}
          
          echo "Function App stopped. Waiting for complete shutdown..."
          sleep 30

      - name: Build Docker image for Function PDF
        id: deploy-pdf
        run: |
          echo "Building Docker image for PDF Function App..."
          
          # Azure Container Registryにログイン
          echo "Logging in to Azure Container Registry: ${{ env.ACR_NAME }}..."
          az acr login --name ${{ env.ACR_NAME }}
          
          # Dockerイメージのビルド
          # シンプルなリポジトリ名を使用（ACRドメイン名の重複を避ける）
          REPOSITORY_NAME="convert-to-pdf"
          IMAGE_NAME="${{ env.ACR_NAME }}.azurecr.io/${REPOSITORY_NAME}"
          IMAGE_TAG="v1"
          
          echo "Building image: ${IMAGE_NAME}:${IMAGE_TAG}"
          cd changedoc/converttopdf
          
          # Dockerイメージをビルド（プロキシ設定なしでビルド）
          docker build \
            --build-arg _PROXY="" \
            -t ${IMAGE_NAME}:${IMAGE_TAG} \
            -f Dockerfile .
          
          # イメージをAzure Container Registryにプッシュ
          echo "Pushing image to ACR..."
          docker push ${IMAGE_NAME}:${IMAGE_TAG}
          
          echo "Docker image built and pushed successfully"
          echo "Image: ${IMAGE_NAME}:${IMAGE_TAG}"
          
          # Function AppのDockerイメージ設定を更新（Function Appが停止中に設定）
          echo "Updating Function App Docker configuration while stopped..."
          echo "Setting image to: ${IMAGE_NAME}:${IMAGE_TAG}"
          
          # 完全なイメージパスを指定（レジストリURL含む）
          az functionapp config container set \
            --name ${{ env.FUNCTION_PDF_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --docker-custom-image-name ${IMAGE_NAME}:${IMAGE_TAG} \
            --docker-registry-server-url https://${{ env.ACR_NAME }}.azurecr.io
          
          echo "Function App Docker configuration updated"
          
          # 設定が正しく適用されたか確認
          echo "Verifying Docker image configuration..."
          CONFIGURED_IMAGE=$(az functionapp config container show \
            --name ${{ env.FUNCTION_PDF_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].value" -o tsv)
          echo "Configured image: ${CONFIGURED_IMAGE}"
          
          cd ../..

      - name: Verify PDF Function App environment variables
        run: |
          echo "Verifying PDF Function App environment variables..."
          echo "Note: FUNCTIONS_WORKER_RUNTIME is configured by Terraform"
          
          # 重要な環境変数を確認
          echo "Critical environment variables:"
          az functionapp config appsettings list \
            --name ${{ env.FUNCTION_PDF_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[?name=='FUNCTIONS_WORKER_RUNTIME' || name=='DOCKER_REGISTRY_SERVER_URL' || name=='AzureWebJobsStorage__accountName' || name=='AZURE_BLOB_STORAGE_DST_CON_STR' || name=='AZURE_BLOB_STORAGE_DST_CONTAINER'].{Name:name,Value:value}" \
            --output table

      - name: Start Function PDF with new configuration
        run: |
          echo "Starting PDF Function App with new Docker image configuration..."
          az functionapp start \
            --name ${{ env.FUNCTION_PDF_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }}
          
          echo "Function App started"
          echo "Waiting for Docker container to start and Python worker to initialize..."
          echo "This includes LibreOffice initialization which can take several minutes."
          echo "Waiting 10 minutes (600 seconds)..."
          sleep 600

      # PDF デプロイ後に認証トークンをリフレッシュ
      # (長時間のDockerビルドと待機によるトークン期限切れを防ぐため)
      - name: Azure Re-login after PDF deployment
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TRIALhs_ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.TRIALhs_ARM_TENANT_ID }}
          subscription-id: ${{ secrets.TRIALhs_ARM_SUBSCRIPTION_ID }}

      # Function 12: Pagespliter 002 (changedoc_standard/pagesplitter)
      - name: Build Function Pagespliter 002 Package
        id: build-pagespliter-002
        run: |
          cd changedoc_standard/pagesplitter
          echo "Building Function Pagespliter 002..."
          rm -rf .python_packages
          pip install -r requirements.txt --target .python_packages/lib/site-packages
          zip -r ../../function-pagespliter-002.zip .
          cd ../..

      - name: Deploy Function Pagespliter 002 to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FUNCTION_PAGESPLITER_002_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: ./function-pagespliter-002.zip

      # Function 13: Markdown 002 (changedoc_standard/markdown)
      - name: Build Function Markdown 002 Package
        id: build-markdown-002
        run: |
          cd changedoc_standard/markdown
          echo "Building Function Markdown 002..."
          rm -rf .python_packages
          pip install -r requirements.txt --target .python_packages/lib/site-packages
          zip -r ../../function-markdown-002.zip .
          cd ../..

      - name: Deploy Function Markdown 002 to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FUNCTION_MARKDOWN_002_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: ./function-markdown-002.zip

      # Function 14: Indexer (changedoc_standard/indexer)  #func-genashi-trial-14-indexer
      - name: Build Function Indexer Package
        id: build-indexer
        run: |
          cd changedoc_standard/indexer
          echo "Building Function Indexer..."
          zip -r ../../function-indexer.zip .
          cd ../..

      - name: Deploy Function Indexer to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FUNCTION_INDEXER_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: ./function-indexer.zip

      - name: Create Backend deployment summary
        if: always()
        run: |
          echo "## Backend Build and Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "### Python Setup" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ steps.setup-python-backend.outcome }}" >> $GITHUB_STEP_SUMMARY
          
          echo "### バックエンド処理 Function App Deployments (1-8)" >> $GITHUB_STEP_SUMMARY
          echo "| Function | Status | App Name | Deploy Method |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|----------|---------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Chat | Success (Direct Deploy) | ${{ env.FUNCTION_CHAT_NAME }} | 🚀 Direct Deploy |" >> $GITHUB_STEP_SUMMARY
          echo "| RAG | Success (Direct Deploy) | ${{ env.FUNCTION_RAG_NAME }} | 🚀 Direct Deploy |" >> $GITHUB_STEP_SUMMARY
          echo "| Register | Success (Direct Deploy) | ${{ env.FUNCTION_REGISTER_NAME }} | 🚀 Direct Deploy |" >> $GITHUB_STEP_SUMMARY
          echo "| PII | Success (Direct Deploy) | ${{ env.FUNCTION_PII_NAME }} | 🚀 Direct Deploy |" >> $GITHUB_STEP_SUMMARY
          echo "| Prompt | Success (Direct Deploy) | ${{ env.FUNCTION_PROMPT_NAME }} | 🚀 Direct Deploy |" >> $GITHUB_STEP_SUMMARY
          echo "| MFG | Success (Direct Deploy) | ${{ env.FUNCTION_MFG_NAME }} | 🚀 Direct Deploy |" >> $GITHUB_STEP_SUMMARY
          echo "| Agent RAG | Success (Direct Deploy) | ${{ env.FUNCTION_AGENT_RAG_NAME }} | 🚀 Direct Deploy |" >> $GITHUB_STEP_SUMMARY
          echo "| Agent Document | Success (Direct Deploy) | ${{ env.FUNCTION_AGENT_DOCUMENT_NAME }} | 🚀 Direct Deploy |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### データ前処理 Function App Deployments (9-14)" >> $GITHUB_STEP_SUMMARY
          echo "| Function | Status | App Name | Deploy Method |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|----------|---------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Pagespliter 001 | Success (Direct Deploy) | ${{ env.FUNCTION_PAGESPLITER_001_NAME }} | 🚀 Direct Deploy |" >> $GITHUB_STEP_SUMMARY
          echo "| Markdown 001 | Success (Direct Deploy) | ${{ env.FUNCTION_MARKDOWN_001_NAME }} | 🚀 Direct Deploy |" >> $GITHUB_STEP_SUMMARY
          echo "| PDF | ${{ steps.deploy-pdf.outcome }} | ${{ env.FUNCTION_PDF_NAME }} | 🐳 Docker Image |" >> $GITHUB_STEP_SUMMARY
          echo "| Pagespliter 002 | Success (Direct Deploy) | ${{ env.FUNCTION_PAGESPLITER_002_NAME }} | 🚀 Direct Deploy |" >> $GITHUB_STEP_SUMMARY
          echo "| Markdown 002 | Success (Direct Deploy) | ${{ env.FUNCTION_MARKDOWN_002_NAME }} | 🚀 Direct Deploy |" >> $GITHUB_STEP_SUMMARY
          echo "| Indexer | Success (Direct Deploy) | ${{ env.FUNCTION_INDEXER_NAME }} | 🚀 Direct Deploy |" >> $GITHUB_STEP_SUMMARY

      # ============================================
      # Function Apps デプロイ完了待機と検証
      # ============================================
      # Event Grid Subscription作成に必要な関数がAzureに認識されるまで待機
      - name: Wait for Function Apps to register functions
        run: |
          echo "Waiting for Azure Functions to be fully recognized..."
          echo "This ensures Event Grid Subscriptions can validate function endpoints."
          echo "PDF Function App uses Docker container (longer startup time expected)"
          echo "Additional wait: 180 seconds (3 minutes) after Docker container restart..."
          echo "Total wait time from restart: 13 minutes (780 seconds)"
          sleep 180

      # ============================================
      # Infrastructure Security Hardening (CORE)
      # ============================================
      # アプリケーションのデプロイ完了後、パブリックネットワークアクセスを無効化
      # NOTE: Event Grid trigger functions の検証は Phase 2 の後に実行
      # （Event Grid Subscriptions は init_flag=false でのみ作成されるため）

      # Phase 2実行前に必要なリソース情報を取得
      - name: Ensure resource information is available for Phase 2
        working-directory: ${{ env.WORKDIR_CORE }}
        run: |
          echo "=========================================="
          echo "Retrieving resource information for Phase 2"
          echo "=========================================="
          
          # Storage Account名を取得（まだ設定されていない場合）
          if [ -z "${{ env.STORAGE_ACCOUNT_NAME }}" ]; then
            echo "Retrieving Storage Account name..."
            STORAGE_ACCOUNT_NAME=$(terraform output -raw storage_account_name 2>/dev/null || echo "")
            echo "STORAGE_ACCOUNT_NAME=$STORAGE_ACCOUNT_NAME" >> $GITHUB_ENV
            echo "  Storage Account: $STORAGE_ACCOUNT_NAME"
          else
            echo "  Storage Account: ${{ env.STORAGE_ACCOUNT_NAME }} (already set)"
          fi
          
          # Resource Group名を取得（まだ設定されていない場合）
          if [ -z "${{ env.RESOURCE_GROUP }}" ]; then
            echo "Retrieving Resource Group name..."
            RESOURCE_GROUP=$(terraform output -raw resource_group_name 2>/dev/null || echo "")
            echo "RESOURCE_GROUP=$RESOURCE_GROUP" >> $GITHUB_ENV
            echo "  Resource Group: $RESOURCE_GROUP"
          else
            echo "  Resource Group: ${{ env.RESOURCE_GROUP }} (already set)"
          fi
          
          echo ""
          echo "✅ Resource information ready for Phase 2"

      # Phase 2 の Plan 実行前にも Storage Account のネットワークルールを一時的に開放
      # （既存リソースの状態確認のため）
      - name: Temporarily allow network access to Storage Account (Phase 2)
        run: |
          echo "Opening network access for Storage Account: ${{ env.STORAGE_ACCOUNT_NAME }}..."
          az storage account update \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --default-action Allow

      # Phase 2 の Plan 実行前に Key Vault のネットワークアクセスも一時的に開放
      # （既存シークレットの状態確認とFunction App Host Keysの取得のため）
      - name: Get Key Vault name from Terraform output
        id: get-key-vault-name
        working-directory: ${{ env.WORKDIR_CORE }}
        run: |
          echo "Retrieving Key Vault name from Terraform output..."
          KEY_VAULT_NAME=$(terraform output -raw key_vault_name 2>&1)
          if [ $? -ne 0 ]; then
            echo "❌ Error: Failed to retrieve Key Vault name from Terraform output"
            echo "Output: $KEY_VAULT_NAME"
            exit 1
          fi
          echo "✅ Key Vault name retrieved: $KEY_VAULT_NAME"
          echo "KEY_VAULT_NAME=$KEY_VAULT_NAME" >> $GITHUB_ENV

      - name: Temporarily allow network access to Key Vault (Phase 2)
        run: |
          echo "=========================================="
          echo "Opening network access for Key Vault..."
          echo "=========================================="
          echo "Key Vault: ${{ env.KEY_VAULT_NAME }}"
          echo "Resource Group: ${{ env.RESOURCE_GROUP }}"
          echo ""
          
          # Key Vaultの現在の設定を確認
          echo "Current Key Vault network settings:"
          az keyvault show --name ${{ env.KEY_VAULT_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query "{publicNetworkAccess:properties.publicNetworkAccess, defaultAction:properties.networkAcls.defaultAction}" -o table
          echo ""
          
          # パブリックネットワークアクセスを有効化
          echo "Enabling public network access..."
          az keyvault update \
            --name ${{ env.KEY_VAULT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --public-network-access Enabled \
            --default-action Allow
          
          if [ $? -ne 0 ]; then
            echo "❌ Error: Failed to update Key Vault network settings"
            exit 1
          fi
          
          echo "✅ Key Vault network access updated successfully"
          echo ""
          
          # 設定変更後の確認
          echo "Updated Key Vault network settings:"
          az keyvault show --name ${{ env.KEY_VAULT_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query "{publicNetworkAccess:properties.publicNetworkAccess, defaultAction:properties.networkAcls.defaultAction}" -o table
          echo ""
          
          # 設定の伝播を待機
          echo "Waiting for network configuration to propagate..."
          sleep 60

      # Function Appのパブリックネットワークアクセスを有効化（Host Keys取得のため）
      - name: Temporarily enable Function App public network access (Phase 2)
        run: |
          echo "=========================================="
          echo "Enabling Function App Public Network Access"
          echo "=========================================="
          echo "This is required for Terraform to retrieve Host Keys"
          echo ""
          
          # Terraform outputから すべての Function App名を取得
          cd ${{ env.WORKDIR_CORE }}
          
          # バックエンド処理用 Function Apps (1-8)
          CHAT_APP=$(terraform output -raw function_chat_name 2>/dev/null || echo "")
          RAG_APP=$(terraform output -raw function_rag_name 2>/dev/null || echo "")
          REGISTER_APP=$(terraform output -raw function_register_name 2>/dev/null || echo "")
          PII_APP=$(terraform output -raw function_pii_name 2>/dev/null || echo "")
          PROMPT_APP=$(terraform output -raw function_prompt_name 2>/dev/null || echo "")
          MFG_APP=$(terraform output -raw function_mfg_name 2>/dev/null || echo "")
          AGENT_RAG_APP=$(terraform output -raw function_agent_rag_name 2>/dev/null || echo "")
          AGENT_DOC_APP=$(terraform output -raw function_agent_document_name 2>/dev/null || echo "")
          
          # データ前処理用 Function Apps (9-14)
          PAGESPLITER_001_APP=$(terraform output -raw function_pagespliter_001_name 2>/dev/null || echo "")
          MARKDOWN_001_APP=$(terraform output -raw function_markdown_001_name 2>/dev/null || echo "")
          PDF_APP=$(terraform output -raw function_pdf_name 2>/dev/null || echo "")
          PAGESPLITER_002_APP=$(terraform output -raw function_pagespliter_002_name 2>/dev/null || echo "")
          MARKDOWN_002_APP=$(terraform output -raw function_markdown_002_name 2>/dev/null || echo "")
          INDEXER_APP=$(terraform output -raw function_indexer_name 2>/dev/null || echo "")
          
          cd -
          
          # すべての Function Appのパブリックアクセスを有効化
          echo "Enabling public network access for all 14 Function Apps..."
          for app_name in "$CHAT_APP" "$RAG_APP" "$REGISTER_APP" "$PII_APP" "$PROMPT_APP" "$MFG_APP" "$AGENT_RAG_APP" "$AGENT_DOC_APP" "$PAGESPLITER_001_APP" "$MARKDOWN_001_APP" "$PDF_APP" "$PAGESPLITER_002_APP" "$MARKDOWN_002_APP" "$INDEXER_APP"; do
            if [ -n "$app_name" ]; then
              echo "  - $app_name"
              az functionapp update \
                --name "$app_name" \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --set publicNetworkAccess=Enabled
            fi
          done
          
          echo ""
          echo "✅ All Function Apps public network access enabled (14 apps)"
          echo ""
          
          # SCMサイトでメインサイトのIP制限を使用（Terraform Host Keys取得のため）
          # メインサイトは "Allow all" なので、SCMも全アクセス許可となる
          echo "Configuring SCM to use main site IP restrictions (allows Terraform Host Keys retrieval)..."
          for app_name in "$CHAT_APP" "$RAG_APP" "$REGISTER_APP" "$PII_APP" "$PROMPT_APP" "$MFG_APP" "$AGENT_RAG_APP" "$AGENT_DOC_APP" "$PAGESPLITER_001_APP" "$MARKDOWN_001_APP" "$PDF_APP" "$PAGESPLITER_002_APP" "$MARKDOWN_002_APP" "$INDEXER_APP"; do
            if [ -n "$app_name" ]; then
              echo "  - $app_name (setting scmIpSecurityRestrictionsUseMain=true)"
              az webapp config set \
                --name "$app_name" \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --generic-configurations '{"scmIpSecurityRestrictionsUseMain": true}'
            fi
          done
          
          echo ""
          echo "✅ All Function Apps SCM configured to use main site IP restrictions (14 apps)"
          echo "   Main site: Allow all → SCM site: Allow all (inherits main)"
          echo ""
          
          # 設定の伝播を待機
          echo "Waiting for network configuration to propagate..."
          sleep 60

      # Function Appの完全起動を待機（Host Keys取得エラー回避のため）
      - name: Wait for Function Apps to be fully ready (Phase 2)
        run: |
          echo "=========================================="
          echo "Waiting for Function Apps to fully start"
          echo "=========================================="
          echo "This helps avoid 'InternalServerError from host runtime' errors when retrieving host keys."
          echo "Wait time: 5 minutes (300 seconds)"
          echo ""
          
          for i in {1..10}; do
            echo "Progress: $((i*10))% ($(( i*30 )) seconds elapsed)"
            sleep 30
          done
          
          echo ""
          echo "✅ Wait completed. Function Apps should be ready now."

      # Function Appの状態確認（診断用）
      - name: Check Function App runtime status
        continue-on-error: true
        run: |
          echo "=========================================="
          echo "Checking Function App Runtime Status"
          echo "=========================================="
          
          # Terraform outputから すべての Function App名を取得
          cd ${{ env.WORKDIR_CORE }}
          
          # バックエンド処理用 Function Apps (1-8)
          CHAT_APP=$(terraform output -raw function_chat_name 2>/dev/null || echo "")
          RAG_APP=$(terraform output -raw function_rag_name 2>/dev/null || echo "")
          REGISTER_APP=$(terraform output -raw function_register_name 2>/dev/null || echo "")
          PII_APP=$(terraform output -raw function_pii_name 2>/dev/null || echo "")
          PROMPT_APP=$(terraform output -raw function_prompt_name 2>/dev/null || echo "")
          MFG_APP=$(terraform output -raw function_mfg_name 2>/dev/null || echo "")
          AGENT_RAG_APP=$(terraform output -raw function_agent_rag_name 2>/dev/null || echo "")
          AGENT_DOC_APP=$(terraform output -raw function_agent_document_name 2>/dev/null || echo "")
          
          # データ前処理用 Function Apps (9-14)
          PAGESPLITER_001_APP=$(terraform output -raw function_pagespliter_001_name 2>/dev/null || echo "")
          MARKDOWN_001_APP=$(terraform output -raw function_markdown_001_name 2>/dev/null || echo "")
          PDF_APP=$(terraform output -raw function_pdf_name 2>/dev/null || echo "")
          PAGESPLITER_002_APP=$(terraform output -raw function_pagespliter_002_name 2>/dev/null || echo "")
          MARKDOWN_002_APP=$(terraform output -raw function_markdown_002_name 2>/dev/null || echo "")
          INDEXER_APP=$(terraform output -raw function_indexer_name 2>/dev/null || echo "")
          
          cd -
          
          # すべての Function Appの状態とランタイムステータスを確認
          echo "Checking all 14 Function Apps..."
          for app_name in "$CHAT_APP" "$RAG_APP" "$REGISTER_APP" "$PII_APP" "$PROMPT_APP" "$MFG_APP" "$AGENT_RAG_APP" "$AGENT_DOC_APP" "$PAGESPLITER_001_APP" "$MARKDOWN_001_APP" "$PDF_APP" "$PAGESPLITER_002_APP" "$MARKDOWN_002_APP" "$INDEXER_APP"; do
            if [ -n "$app_name" ]; then
              echo ""
              echo "--- Function App: $app_name ---"
              
              # 基本状態とネットワーク設定を確認
              az functionapp show \
                --name "$app_name" \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --query "{state:state, availabilityState:availabilityState, enabled:enabled, publicNetworkAccess:publicNetworkAccess, vnetRouteAllEnabled:vnetRouteAllEnabled}" \
                -o table 2>/dev/null || echo "Failed to get app info"
              
              # ランタイムステータス（ヘルスチェック）
              echo "Runtime Status:"
              az functionapp show \
                --name "$app_name" \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --query "siteConfig.{alwaysOn:alwaysOn, functionAppScaleLimit:functionAppScaleLimit, minimumElasticInstanceCount:minimumElasticInstanceCount}" \
                -o table 2>/dev/null || echo "Failed to get runtime config"
            fi
          done
          
          echo ""
          echo "✅ Checked all 14 Function Apps"
          echo "=========================================="

      # ============================================
      # Terraform State 修正: Load Balancer 環境変数リソースの削除
      # ============================================
      # Load Balancer Deploy (azure/webapps-deploy@v3) により環境変数が上書きされた後、
      # Phase 2 で環境変数を再設定するため、State から loadbalancer_appsettings を削除
      # これにより Phase 2 で loadbalancer_appsettings が新規作成され、全環境変数が確実に設定される
      - name: Remove loadbalancer_appsettings from Terraform State before Phase 2
        working-directory: ${{ env.WORKDIR_CORE }}
        run: |
          echo "=========================================="
          echo "Terraform State Cleanup (Load Balancer)"
          echo "=========================================="
          echo "Removing loadbalancer_appsettings from State to ensure"
          echo "environment variables are correctly applied in Phase 2."
          echo ""
          echo "Background:"
          echo "  - Phase 1: loadbalancer_appsettings created with 23 environment variables"
          echo "  - Load Balancer Deploy: azure/webapps-deploy@v3 reset to 2 variables"
          echo "  - azapi_update_resource refresh bug: doesn't detect State vs Azure difference"
          echo "  - Phase 2: Must recreate loadbalancer_appsettings to restore all 23 variables"
          echo ""
          echo "State resource name: module.app_service.azapi_update_resource.loadbalancer_appsettings"
          echo "(No array index - count parameter removed from main.tf)"
          echo ""
          
          # State からリソースを削除（存在しない場合はエラーを無視）
          echo "Attempting to remove from State..."
          terraform state rm 'module.app_service.azapi_update_resource.loadbalancer_appsettings' || echo "Resource not found in state (expected on initial deployment)"
          
          echo ""
          echo "✅ State cleanup completed"
          echo "Terraform Plan will now show 'loadbalancer_appsettings' as new resource to create"
          echo "Phase 2 Apply will recreate it with all 23 environment variables"
          echo "=========================================="
          echo ""

      # ============================================
      # Azure Re-authentication
      # ============================================
      # Terraform Applyが長時間実行された場合、トークンが期限切れになる可能性があるため
      # Function App設定変更前に再認証を実行
      - name: Azure Re-login (Refresh Token)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TRIALhs_ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.TRIALhs_ARM_TENANT_ID }}
          subscription-id: ${{ secrets.TRIALhs_ARM_SUBSCRIPTION_ID }}

      # ============================================
      # Function Apps: Restore Private Network Access
      # ============================================
      # Terraform Apply完了後、Function Appのパブリックアクセスを無効化
      # (Host Keys取得のため一時的にEnabledにしていたものをDisabledに戻す)
      - name: Restore Function App private network access
        run: |
          echo "=========================================="
          echo "Restoring Function App Private Access"
          echo "=========================================="
          echo "After Terraform Apply, Function Apps need to be set to private network."
          echo ""
          
          # Terraform outputから すべての Function App名を取得
          cd ${{ env.WORKDIR_CORE }}
          
          # バックエンド処理用 Function Apps (1-8)
          CHAT_APP=$(terraform output -raw function_chat_name 2>/dev/null || echo "")
          RAG_APP=$(terraform output -raw function_rag_name 2>/dev/null || echo "")
          REGISTER_APP=$(terraform output -raw function_register_name 2>/dev/null || echo "")
          PII_APP=$(terraform output -raw function_pii_name 2>/dev/null || echo "")
          PROMPT_APP=$(terraform output -raw function_prompt_name 2>/dev/null || echo "")
          MFG_APP=$(terraform output -raw function_mfg_name 2>/dev/null || echo "")
          AGENT_RAG_APP=$(terraform output -raw function_agent_rag_name 2>/dev/null || echo "")
          AGENT_DOC_APP=$(terraform output -raw function_agent_document_name 2>/dev/null || echo "")
          
          # データ前処理用 Function Apps (9-14)
          PAGESPLITER_001_APP=$(terraform output -raw function_pagespliter_001_name 2>/dev/null || echo "")
          MARKDOWN_001_APP=$(terraform output -raw function_markdown_001_name 2>/dev/null || echo "")
          PDF_APP=$(terraform output -raw function_pdf_name 2>/dev/null || echo "")
          PAGESPLITER_002_APP=$(terraform output -raw function_pagespliter_002_name 2>/dev/null || echo "")
          MARKDOWN_002_APP=$(terraform output -raw function_markdown_002_name 2>/dev/null || echo "")
          INDEXER_APP=$(terraform output -raw function_indexer_name 2>/dev/null || echo "")
          
          cd -
          
          # すべての Function Appのパブリックアクセスを無効化
          echo "Disabling public network access for all 14 Function Apps..."
          for app_name in "$CHAT_APP" "$RAG_APP" "$REGISTER_APP" "$PII_APP" "$PROMPT_APP" "$MFG_APP" "$AGENT_RAG_APP" "$AGENT_DOC_APP" "$PAGESPLITER_001_APP" "$MARKDOWN_001_APP" "$PDF_APP" "$PAGESPLITER_002_APP" "$MARKDOWN_002_APP" "$INDEXER_APP"; do
            if [ -n "$app_name" ]; then
              echo "  - $app_name"
              az functionapp update \
                --name "$app_name" \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --set publicNetworkAccess=Disabled
            fi
          done
          
          echo ""
          echo "✅ All Function Apps are now on private network (14 apps)"
          echo "   Public access: Disabled"
          echo "   VNet integration: Active"
          echo ""
          
          # SCMサイトの設定を元に戻す（独自のIP制限を使用 + デフォルトアクションをDenyに設定）
          echo "Restoring SCM to use separate IP restrictions with Deny default action..."
          for app_name in "$CHAT_APP" "$RAG_APP" "$REGISTER_APP" "$PII_APP" "$PROMPT_APP" "$MFG_APP" "$AGENT_RAG_APP" "$AGENT_DOC_APP" "$PAGESPLITER_001_APP" "$MARKDOWN_001_APP" "$PDF_APP" "$PAGESPLITER_002_APP" "$MARKDOWN_002_APP" "$INDEXER_APP"; do
            if [ -n "$app_name" ]; then
              echo "  - $app_name (scmUseMain=false, scmDefaultAction=Deny)"
              az webapp config set \
                --name "$app_name" \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --generic-configurations '{"scmIpSecurityRestrictionsUseMain": false, "scmIpSecurityRestrictionsDefaultAction": "Deny"}'
            fi
          done
          
          echo ""
          echo "✅ All Function Apps SCM restored to separate IP restrictions (14 apps)"
          echo "   Main site: Disabled (private VNet) | SCM site: Deny all (scmUseMain=false, scmDefaultAction=Deny)"
          echo ""
          echo "=========================================="

      # ============================================
      # AI Service Infrastructure Deployment
      # ============================================
      # COREインフラストラクチャとアプリケーションデプロイ完了後、
      # AI関連サービス（Azure OpenAI, AI Search等）をデプロイ

      # AI Service デプロイ前に認証トークンをリフレッシュ
      # （Terraform Phase 2とFunction App設定変更実行後の長時間経過によるトークン期限切れを防ぐため）
      - name: Azure Re-login before AI service deployment
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TRIALhs_ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.TRIALhs_ARM_TENANT_ID }}
          subscription-id: ${{ secrets.TRIALhs_ARM_SUBSCRIPTION_ID }}

      # AI_SERVICE - Step 3: Plan with init_flag=true
      - name: Terraform Init (ai_service)
        working-directory: ${{ env.WORKDIR_AI }}
        run: terraform init -input=false -upgrade

      - name: Terraform Validate (ai_service)
        working-directory: ${{ env.WORKDIR_AI }}
        run: terraform validate

      - name: Terraform Plan with init_flag=true (ai_service)
        working-directory: ${{ env.WORKDIR_AI }}
        run: |
          terraform plan -input=false -no-color -out=tfplan_ai_init -var="init_flag=true"

      # AI_SERVICE - Step 4: Apply with init_flag=true
      - name: Terraform Apply with init_flag=true (ai_service)
        working-directory: ${{ env.WORKDIR_AI }}
        run: terraform apply -input=false -auto-approve -parallelism=2 tfplan_ai_init

      # AI_SERVICE - Step 5: Azure AI Search Schema Deployment
      # Azure AI Searchのインデックス、データソース、スキルセット、インデクサーを作成
      - name: Get Azure AI Search service name from Terraform output
        id: get-search-name
        working-directory: ${{ env.WORKDIR_AI }}
        run: |
          SEARCH_SERVICE_NAME=$(terraform output -raw ai_search_service_name)
          echo "SEARCH_SERVICE_NAME=$SEARCH_SERVICE_NAME" >> $GITHUB_ENV
          echo "SERVICE_NAME=$SEARCH_SERVICE_NAME" >> $GITHUB_ENV

      - name: Setup Python for AI Search Schema Deployment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: infra/scripts/requirements.txt

      - name: Install Python dependencies for AI Search
        run: pip install -r infra/scripts/requirements.txt

      - name: Azure Login for Python script (Token Refresh)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TRIALhs_ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.TRIALhs_ARM_TENANT_ID }}
          subscription-id: ${{ secrets.TRIALhs_ARM_SUBSCRIPTION_ID }}

      # AI Search スキーマデプロイのために Storage Account のネットワークアクセスを一時的に開放
      # CORE Apply without init_flag により Storage Account は Deny 状態になっているため、
      # AI Search がデータソースに接続できるよう一時的に Allow に変更
      - name: Temporarily allow Storage Account access for AI Search schema deployment
        run: |
          echo "=========================================="
          echo "Temporarily Opening Storage Account Access"
          echo "=========================================="
          echo "Storage Account: ${{ env.STORAGE_ACCOUNT_NAME }}"
          echo "Resource Group: ${{ env.RESOURCE_GROUP }}"
          echo ""
          echo "Reason: AI Search needs to connect to Storage Account for datasource creation."
          echo "Current state: network_default_action='Deny' (set by CORE without init_flag)"
          echo "Temporary change: network_default_action='Allow'"
          echo ""
          
          # 現在の設定を確認
          echo "Current Storage Account network settings:"
          az storage account show \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "{name:name, publicNetworkAccess:publicNetworkAccess, defaultAction:networkRuleSet.defaultAction}" \
            -o table
          echo ""
          
          # ネットワークアクセスを一時的に開放
          echo "Temporarily allowing network access..."
          az storage account update \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --default-action Allow
          
          if [ $? -ne 0 ]; then
            echo "❌ Error: Failed to update Storage Account network settings"
            exit 1
          fi
          
          echo "✅ Storage Account network access temporarily allowed"
          echo ""
          
          # 設定変更後の確認
          echo "Updated Storage Account network settings:"
          az storage account show \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "{name:name, publicNetworkAccess:publicNetworkAccess, defaultAction:networkRuleSet.defaultAction}" \
            -o table
          echo ""
          
          # 設定の伝播を待機
          echo "Waiting for network configuration to propagate (30 seconds)..."
          sleep 30
          echo "✅ Ready for AI Search schema deployment"
          echo "=========================================="

      # AI Search Shared Private Link接続を承認
      # インデクサーがPrivate Endpoint経由でリソースにアクセスできるようにする
      - name: Approve AI Search Shared Private Link connections
        run: |
          echo "=========================================="
          echo "Approving AI Search Shared Private Link Connections"
          echo "=========================================="
          echo "AI Search Service: $SERVICE_NAME"
          echo "Resource Group: $RESOURCE_GROUP"
          echo ""
          
          # すべてのShared Private Linkの状態を取得
          echo "Current Shared Private Link status:"
          az search shared-private-link-resource list \
            --service-name "$SERVICE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[].{Name:name, Status:properties.status, State:properties.provisioningState, GroupId:properties.groupId}" \
            -o table
          echo ""
          
          # Shared Private Linkリソースを取得
          SHARED_LINKS=$(az search shared-private-link-resource list \
            --service-name "$SERVICE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?properties.status=='Pending'].{name:name, resourceId:properties.privateLinkResourceId, groupId:properties.groupId}" \
            -o json)
          
          if [ -z "$SHARED_LINKS" ] || [ "$SHARED_LINKS" == "[]" ]; then
            echo "✅ No pending Shared Private Link connections found"
          else
            echo "Found pending Shared Private Link connections:"
            echo "$SHARED_LINKS" | jq -r '.[] | "  - \(.name) (\(.groupId))"'
            echo ""
            
            # 各Shared Private Linkに対応するPrivate Endpoint接続を承認
            echo "$SHARED_LINKS" | jq -c '.[]' | while read -r link; do
              LINK_NAME=$(echo "$link" | jq -r '.name')
              RESOURCE_ID=$(echo "$link" | jq -r '.resourceId')
              GROUP_ID=$(echo "$link" | jq -r '.groupId')
              
              echo "Processing: $LINK_NAME ($GROUP_ID)"
              echo "  Target Resource: $RESOURCE_ID"
              
              # Private Endpoint接続一覧を取得
              PE_CONNECTIONS=$(az network private-endpoint-connection list \
                --id "$RESOURCE_ID" \
                --query "[?properties.privateLinkServiceConnectionState.status=='Pending']" \
                -o json 2>/dev/null)
              
              if [ $? -eq 0 ] && [ ! -z "$PE_CONNECTIONS" ] && [ "$PE_CONNECTIONS" != "[]" ]; then
                echo "  Found pending Private Endpoint connections"
                
                # 各Pending接続を承認
                echo "$PE_CONNECTIONS" | jq -r '.[].id' | while read -r PE_ID; do
                  echo "  Approving connection: $(basename $PE_ID)"
                  az network private-endpoint-connection approve \
                    --id "$PE_ID" \
                    --description "AI Search Shared Private Link - Auto-approved by CI/CD" \
                    2>&1 | grep -v "^$" || true
                  
                  if [ $? -eq 0 ]; then
                    echo "  ✅ Approved: $(basename $PE_ID)"
                  else
                    echo "  ⚠️  Warning: Failed to approve $(basename $PE_ID)"
                  fi
                done
              else
                echo "  ℹ️  No pending Private Endpoint connections found (may already be approved)"
              fi
              echo ""
            done
            
            # 承認処理後、状態が更新されるまで待機
            echo "Waiting for Private Endpoint approval to propagate (30 seconds)..."
            sleep 30
            
            # 最終状態確認
            echo ""
            echo "Final Shared Private Link status:"
            az search shared-private-link-resource list \
              --service-name "$SERVICE_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query "[].{Name:name, Status:properties.status, State:properties.provisioningState}" \
              -o table
          fi
          
          echo ""
          echo "✅ Shared Private Link approval process completed"
          echo "=========================================="

      - name: Deploy Azure AI Search schemas
        run: |
          echo "Deploying Azure AI Search schemas"
          echo "  Service Name: $SERVICE_NAME"
          echo "  Resource Group: $RESOURCE_GROUP"
          echo "  Schemas Directory: $SCHEMAS_DIR"
          python infra/scripts/ai_search.py \
            --service-name "$SERVICE_NAME" \
            --schemas-dir "$SCHEMAS_DIR" \
            --resource-group "$RESOURCE_GROUP" \
            --subscription-id "$ARM_SUBSCRIPTION_ID" \
            --verbose

      # スキーマデプロイ完了後の待機時間（Azure AI Searchの操作完了を確実にするため）
      - name: Wait for Azure AI Search operations to complete
        run: |
          echo "Waiting for Azure AI Search operations to complete..."
          echo "This ensures schema deployment is fully processed before service configuration changes."
          sleep 180

      # ============================================
      # CORE Infrastructure Final Configuration
      # ============================================
      # AI Search スキーマデプロイ完了後、Storage AccountがAllow状態のまま
      # CORE Phase 3を実行（ネットワーク再開放不要）
      # その後、一度だけDenyに戻す（効率化）

      # CORE - Step 6: Plan without init_flag
      # Note: Storage Account は AI Search デプロイ時に既に Allow 状態
      - name: Terraform Plan without init_flag (core)
        working-directory: ${{ env.WORKDIR_CORE }}
        run: |
          echo "========================================="
          echo "CORE Phase 3: Final Configuration"
          echo "========================================="
          echo "Storage Account is already Allow (from AI Search deployment)"
          echo "No network access change needed - executing Terraform Plan directly"
          echo ""
          terraform plan -input=false -no-color -out=tfplan_core_noinit \
            -var="frontend_auth_client_id=${{ env.FRONTEND_AUTH_CLIENT_ID }}" \
            -var="frontend_auth_client_secret=${{ env.FRONTEND_AUTH_CLIENT_SECRET }}"

      # CORE - Step 7: Apply without init_flag
      - name: Terraform Apply without init_flag (core)
        working-directory: ${{ env.WORKDIR_CORE }}
        run: terraform apply -input=false -auto-approve tfplan_core_noinit

      # CORE Phase 3 完了後、Storage Account のネットワークアクセスを制限
      # セキュリティのため、一時的に開放していたアクセスを Deny 状態に戻す
      - name: Restore Storage Account network restrictions after CORE deployment
        run: |
          echo "=========================================="
          echo "Restoring Storage Account Network Restrictions"
          echo "=========================================="
          echo "Storage Account: ${{ env.STORAGE_ACCOUNT_NAME }}"
          echo "Resource Group: ${{ env.RESOURCE_GROUP }}"
          echo ""
          echo "AI Search schema deployment completed."
          echo "Restoring network restrictions: network_default_action='Deny'"
          echo ""
          
          # 現在の設定を確認
          echo "Current Storage Account network settings:"
          az storage account show \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "{name:name, publicNetworkAccess:publicNetworkAccess, defaultAction:networkRuleSet.defaultAction}" \
            -o table
          echo ""
          
          # ネットワークアクセスを制限
          echo "Restoring network restrictions (Deny)..."
          az storage account update \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --default-action Deny
          
          if [ $? -ne 0 ]; then
            echo "❌ Error: Failed to restore Storage Account network settings"
            exit 1
          fi
          
          echo "✅ Storage Account network restrictions restored"
          echo ""
          
          # 設定変更後の確認
          echo "Restored Storage Account network settings:"
          az storage account show \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "{name:name, publicNetworkAccess:publicNetworkAccess, defaultAction:networkRuleSet.defaultAction}" \
            -o table
          echo ""
          echo "✅ Storage Account is now secure with Deny default action"
          echo "   Only VNet subnet and Private Endpoint access allowed"
          echo "=========================================="

      # AI_SERVICE - Step 8: Plan without init_flag
      - name: Terraform Plan without init_flag (ai_service)
        working-directory: ${{ env.WORKDIR_AI }}
        run: |
          terraform plan -input=false -no-color -out=tfplan_ai_noinit

      # AI_SERVICE - Step 9: Apply without init_flag
      - name: Terraform Apply without init_flag (ai_service)
        working-directory: ${{ env.WORKDIR_AI }}
        run: terraform apply -input=false -auto-approve tfplan_ai_noinit

      # Note: CORE Step 6-7 は AI Search スキーマデプロイ直後に実行済み
      # Storage Account は既に Deny 状態に戻されている

      # ============================================
      # Final Security Hardening
      # ============================================
      # すべてのデプロイ完了後、Storage AccountとKey Vaultのパブリックネットワークアクセスを完全に無効化
      # Terraform Applyでは常にEnabledのままにして、最終ステップでDisabledに変更することで
      # GitHub Actionsランナーからのアクセスエラーを回避

      # Final Security Hardening 前に認証トークンをリフレッシュ
      - name: Azure Re-login before final security hardening
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TRIALhs_ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.TRIALhs_ARM_TENANT_ID }}
          subscription-id: ${{ secrets.TRIALhs_ARM_SUBSCRIPTION_ID }}

      - name: Disable public network access for Storage Account and Key Vault
        run: |
          echo "=========================================="
          echo "Final Security Hardening"
          echo "=========================================="
          echo "Disabling public network access for Storage Account and Key Vault..."
          echo ""
          
          # Storage Accountのパブリックネットワークアクセスを無効化
          echo "1. Storage Account: ${{ env.STORAGE_ACCOUNT_NAME }}"
          echo "   Current status:"
          az storage account show \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "{name:name, publicNetworkAccess:publicNetworkAccess, defaultAction:networkRuleSet.defaultAction}" \
            -o table
          
          echo "   Disabling public network access..."
          az storage account update \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --public-network-access Disabled
          
          if [ $? -ne 0 ]; then
            echo "   ❌ Error: Failed to disable Storage Account public network access"
            exit 1
          fi
          
          echo "   ✅ Storage Account public network access disabled"
          echo ""
          
          # Key Vaultのパブリックネットワークアクセスを無効化
          echo "2. Key Vault: ${{ env.KEY_VAULT_NAME }}"
          echo "   Current status:"
          az keyvault show \
            --name ${{ env.KEY_VAULT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "{name:name, publicNetworkAccess:properties.publicNetworkAccess, defaultAction:properties.networkAcls.defaultAction}" \
            -o table
          
          echo "   Disabling public network access and setting default action to Deny..."
          az keyvault update \
            --name ${{ env.KEY_VAULT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --public-network-access Disabled \
            --default-action Deny
          
          if [ $? -ne 0 ]; then
            echo "   ❌ Error: Failed to disable Key Vault public network access and set default action"
            exit 1
          fi
          
          echo "   ✅ Key Vault public network access disabled and default action set to Deny"
          echo ""
          
          # 設定変更後の確認
          echo "Final verification:"
          echo "Storage Account:"
          az storage account show \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "{name:name, publicNetworkAccess:publicNetworkAccess, defaultAction:networkRuleSet.defaultAction}" \
            -o table
          
          echo ""
          echo "Key Vault:"
          az keyvault show \
            --name ${{ env.KEY_VAULT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "{name:name, publicNetworkAccess:properties.publicNetworkAccess, defaultAction:properties.networkAcls.defaultAction}" \
            -o table
          
          echo ""
          echo "=========================================="
          echo "✅ Final Security Hardening Complete"
          echo "=========================================="
          echo "All resources are now fully secured:"
          echo "  - Storage Account: Public Network Access = Disabled"
          echo "  - Key Vault: Public Network Access = Disabled, Default Action = Deny"
          echo "  - Function Apps (14): Public Network Access = Disabled"
          echo "  - All services: Private Endpoint access only"
          echo "=========================================="

      # ============================================
      # Restart Critical Services
      # ============================================
      # セキュリティ設定変更後、フロントエンド、ロードバランサー、PDF Functionを再起動
      # Private Endpoint経由の接続を確実にするため
      
      - name: Get Frontend, Load Balancer, and PDF Function App names from Terraform
        id: get-restart-targets
        working-directory: ${{ env.WORKDIR_CORE }}
        run: |
          echo "Retrieving service names from Terraform output..."
          FRONTEND_APP=$(terraform output -raw frontend_app_service_name 2>/dev/null || echo "")
          LOADBALANCER_APP=$(terraform output -raw loadbalancer_app_service_name 2>/dev/null || echo "")
          PDF_FUNCTION_APP=$(terraform output -raw function_pdf_name 2>/dev/null || echo "")
          
          echo "FRONTEND_APP=$FRONTEND_APP" >> $GITHUB_ENV
          echo "LOADBALANCER_APP=$LOADBALANCER_APP" >> $GITHUB_ENV
          echo "PDF_FUNCTION_APP=$PDF_FUNCTION_APP" >> $GITHUB_ENV
          
          echo "✅ Service names retrieved:"
          echo "  Frontend: $FRONTEND_APP"
          echo "  Load Balancer: $LOADBALANCER_APP"
          echo "  PDF Function: $PDF_FUNCTION_APP"

      - name: Restart Frontend, Load Balancer, and PDF Function
        run: |
          echo "=========================================="
          echo "Restarting Critical Services"
          echo "=========================================="
          echo "After network security changes, restarting services to ensure"
          echo "proper Private Endpoint connections are established."
          echo ""
          
          # Frontend App Serviceの再起動
          if [ -n "${{ env.FRONTEND_APP }}" ]; then
            echo "1. Restarting Frontend App Service: ${{ env.FRONTEND_APP }}"
            az webapp restart \
              --name ${{ env.FRONTEND_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }}
            echo "   ✅ Frontend App Service restarted"
          else
            echo "   ⚠️ Frontend App Service name not found, skipping restart"
          fi
          echo ""
          
          # Load Balancer App Serviceの再起動
          if [ -n "${{ env.LOADBALANCER_APP }}" ]; then
            echo "2. Restarting Load Balancer App Service: ${{ env.LOADBALANCER_APP }}"
            az webapp restart \
              --name ${{ env.LOADBALANCER_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }}
            echo "   ✅ Load Balancer App Service restarted"
          else
            echo "   ⚠️ Load Balancer App Service name not found, skipping restart"
          fi
          echo ""
          
          # PDF Function Appの再起動
          if [ -n "${{ env.PDF_FUNCTION_APP }}" ]; then
            echo "3. Restarting PDF Function App: ${{ env.PDF_FUNCTION_APP }}"
            az functionapp restart \
              --name ${{ env.PDF_FUNCTION_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }}
            echo "   ✅ PDF Function App restarted"
          else
            echo "   ⚠️ PDF Function App name not found, skipping restart"
          fi
          echo ""
          
          echo "=========================================="
          echo "✅ Service Restart Complete"
          echo "=========================================="
          echo "All critical services have been restarted:"
          echo "  - Frontend App Service"
          echo "  - Load Balancer App Service"
          echo "  - PDF Function App"
          echo ""
          echo "Services are now using Private Endpoint connections only."
          echo "=========================================="