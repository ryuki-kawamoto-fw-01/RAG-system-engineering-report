# ============================================
# Backend Test Pipeline - 使い方ガイド
# ============================================
#
# 【概要】
# バックエンド（orchestrator）のPythonテストを自動実行するワークフローです。
# pytest、カバレッジレポート、静的解析を実行します。
#
# 【トリガー条件】
# - プルリクエスト時（backend/配下の変更のみ）
#
# 【テスト対象の追加方法】
# 新しいorchestratorをテスト対象に追加する場合:
# 1. strategy.matrix.orchestratorにディレクトリ名を追加
#    例: - "orchestrator-new"
# 2. 各orchestratorは並列で実行されます
# 3. testsディレクトリがない場合は自動的にエラーになります
# 4. orchestratorディレクトリ自体が存在しない場合はスキップされます（エラーにはなりません）
#
# 【動作仕様】
# - fail-fast: false により、1つのorchestratorが失敗しても他は続行
# - ディレクトリが存在しない → スキップ（ワークフロー成功）
# - testsディレクトリがない → エラー（ワークフロー失敗）
# - テストが失敗 → エラー（ワークフロー失敗）
#
# 【現在のテスト対象】
# - orchestrator (他のorchestratorを追加する場合はmatrix.orchestratorのコメントを解除)
#
# ============================================

name: Backend Test Pipeline

on:
  # プルリクエスト時（バックエンド関連の変更のみ）
  pull_request:
    branches: [feature/xxx]
    paths:
      - 'backend/**'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ============================================
  # Backend Tests
  # ============================================
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      fail-fast: false  # 1つのorchestratorが失敗しても他のテストを続行
      matrix:
        python-version: ["3.12"]
        orchestrator:
          # 現在テスト対象（追加する場合は下のコメントアウトを解除）
          - "orchestrator"
          
          # 全orchestratorをテストする場合は以下のコメントアウトを解除
          # - "orchestrator-agent"
          # - "orchestrator-deep-research"
          # - "orchestrator-it"
          # - "orchestrator-mfg"
          # - "orchestrator-pii"
          # - "orchestrator-prompt"
          # - "orchestrator-rag"
          # - "orchestrator-text-register"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.orchestrator }}-${{ hashFiles('backend/${{ matrix.orchestrator }}/requirements.txt') }}

      - name: Check if orchestrator directory exists
        id: check_directory
        run: |
          if [ -d "backend/${{ matrix.orchestrator }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✓ Directory exists: backend/${{ matrix.orchestrator }}"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠ Directory not found: backend/${{ matrix.orchestrator }}"
            echo "This orchestrator will be skipped (not an error)"
          fi

      - name: Install dependencies
        if: steps.check_directory.outputs.exists == 'true'
        working-directory: backend/${{ matrix.orchestrator }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov pytest-mock

      - name: Run Python tests
        if: steps.check_directory.outputs.exists == 'true'
        working-directory: backend/${{ matrix.orchestrator }}
        run: |
          set -e
          set -o pipefail
          START_TIME=$(date +%s)
          echo "ORCHESTRATOR_NAME=${{ matrix.orchestrator }}" >> $GITHUB_ENV
          
          if [ -d tests ]; then
            echo "Running tests for ${{ matrix.orchestrator }}..."
            python -m pytest tests/code \
              --verbose \
              --cov=. \
              --cov-report=xml \
              --cov-report=html \
              --cov-report=term-missing \
              --junitxml=test-results.xml \
              --tb=short 2>&1 | tee test-output.log
            
            # pytestが成功した場合のみ実行時間を記録
            END_TIME=$(date +%s)
            DURATION=$((END_TIME - START_TIME))
            echo "Test duration for ${{ matrix.orchestrator }}: ${DURATION}s"
            echo "PYTEST_DURATION=${DURATION}" >> $GITHUB_ENV
            echo "PYTEST_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "No tests directory found for ${{ matrix.orchestrator }}"
            echo "PYTEST_DURATION=0" >> $GITHUB_ENV
            echo "PYTEST_SUCCESS=skipped" >> $GITHUB_ENV
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.orchestrator }}
          path: |
            backend/${{ matrix.orchestrator }}/test-results.xml
            backend/${{ matrix.orchestrator }}/htmlcov/
            backend/${{ matrix.orchestrator }}/test-output.log

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend/${{ matrix.orchestrator }}
          flags: backend-${{ matrix.orchestrator }}
          name: ${{ matrix.orchestrator }}-coverage
