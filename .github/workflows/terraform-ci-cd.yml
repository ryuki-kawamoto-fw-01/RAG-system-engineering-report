name: Infra CI/CD (Core 5-Phase Deploy)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # Terraform settings（Phase 0）
  TF_VERSION: "1.14.3"
  WORKDIR_CORE: original-beta/infra/tenant/sst-harc/trial/core
  ENVIRONMENT_PREFIX: "hs01"
  # Azure credentials (OIDC)
  ARM_CLIENT_ID: ${{ secrets.TRIALhs01_ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.TRIALhs01_ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.TRIALhs01_ARM_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  # Frontend Authentication
  FRONTEND_AUTH_CLIENT_ID: ${{ secrets.TRIALHS_FRONTEND_AUTH_CLIENT_ID }}
  FRONTEND_AUTH_CLIENT_SECRET: ${{ secrets.TRIALHS_FRONTEND_AUTH_CLIENT_SECRET }}

jobs:
  phase1_core:
    name: Phase 1 - Core Infra
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: trial
    outputs:
      resource_group: ${{ steps.prepare_names.outputs.resource_group }}
      storage_account_name: ${{ steps.prepare_names.outputs.storage_account_name }}
      acr_name: ${{ steps.prepare_names.outputs.acr_name }}
      frontend_app_name: ${{ steps.prepare_names.outputs.frontend_app_name }}
      loadbalancer_app_name: ${{ steps.prepare_names.outputs.loadbalancer_app_name }}
      function_chat_name: ${{ steps.prepare_names.outputs.function_chat_name }}
      function_rag_name: ${{ steps.prepare_names.outputs.function_rag_name }}
      function_register_name: ${{ steps.prepare_names.outputs.function_register_name }}
      function_pii_name: ${{ steps.prepare_names.outputs.function_pii_name }}
      function_prompt_name: ${{ steps.prepare_names.outputs.function_prompt_name }}
      function_mfg_name: ${{ steps.prepare_names.outputs.function_mfg_name }}
      function_agent_rag_name: ${{ steps.prepare_names.outputs.function_agent_rag_name }}
      function_agent_document_name: ${{ steps.prepare_names.outputs.function_agent_document_name }}
      function_pagesplitter_001_name: ${{ steps.prepare_names.outputs.function_pagesplitter_001_name }}
      function_markdown_001_name: ${{ steps.prepare_names.outputs.function_markdown_001_name }}
      function_pdf_name: ${{ steps.prepare_names.outputs.function_pdf_name }}
      function_pagesplitter_002_name: ${{ steps.prepare_names.outputs.function_pagesplitter_002_name }}
      function_markdown_002_name: ${{ steps.prepare_names.outputs.function_markdown_002_name }}
      function_indexer_name: ${{ steps.prepare_names.outputs.function_indexer_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TRIALhs01_ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.TRIALhs01_ARM_TENANT_ID }}
          subscription-id: ${{ secrets.TRIALhs01_ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Phase 1 - Terraform Init / Validate / Apply (init_flag=true)
        working-directory: ${{ env.WORKDIR_CORE }}
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false -upgrade
          terraform validate
          terraform plan \
            -input=false \
            -var="tenant_id=${ARM_TENANT_ID}" \
            -var="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -var="environment_prefix=${ENVIRONMENT_PREFIX}" \
            -var="frontend_auth_client_id=${FRONTEND_AUTH_CLIENT_ID}" \
            -var="frontend_auth_client_secret=${FRONTEND_AUTH_CLIENT_SECRET}" \
            -var="init_flag=true" \
            -out=tfplan-phase1
          terraform apply -input=false tfplan-phase1

      - name: Prepare resource names (Terraform output preferred)
        id: prepare_names
        working-directory: ${{ env.WORKDIR_CORE }}
        shell: bash
        run: |
          set -euo pipefail

          tfout() {
            local key="$1"
            terraform output -raw "$key" 2>/dev/null || true
          }

          prefix="${ENVIRONMENT_PREFIX}"

          RESOURCE_GROUP="$(tfout resource_group_name)"
          STORAGE_ACCOUNT_NAME="$(tfout storage_account_name)"
          ACR_NAME="$(tfout container_registry_name)"
          FRONTEND_APP_NAME="$(tfout frontend_app_service_name)"
          LOADBALANCER_APP_NAME="$(tfout loadbalancer_app_service_name)"
          FUNCTION_CHAT_NAME="$(tfout function_chat_name)"
          FUNCTION_RAG_NAME="$(tfout function_rag_name)"
          FUNCTION_REGISTER_NAME="$(tfout function_register_name)"
          FUNCTION_PII_NAME="$(tfout function_pii_name)"
          FUNCTION_PROMPT_NAME="$(tfout function_prompt_name)"
          FUNCTION_MFG_NAME="$(tfout function_mfg_name)"
          FUNCTION_AGENT_RAG_NAME="$(tfout function_agent_rag_name)"
          FUNCTION_AGENT_DOCUMENT_NAME="$(tfout function_agent_document_name)"
          FUNCTION_PAGESPLITTER_001_NAME="$(tfout function_pagespliter_001_name)"
          FUNCTION_MARKDOWN_001_NAME="$(tfout function_markdown_001_name)"
          FUNCTION_PDF_NAME="$(tfout function_pdf_name)"
          FUNCTION_PAGESPLITTER_002_NAME="$(tfout function_pagespliter_002_name)"
          FUNCTION_MARKDOWN_002_NAME="$(tfout function_markdown_002_name)"
          FUNCTION_INDEXER_NAME="$(tfout function_indexer_name)"

          {
            echo "resource_group=${RESOURCE_GROUP:-rg-genashi-trial-${prefix}}"
            echo "storage_account_name=${STORAGE_ACCOUNT_NAME:-stgenashitrial${prefix}}"
            echo "acr_name=${ACR_NAME:-crgenashitrial${prefix}}"
            echo "frontend_app_name=${FRONTEND_APP_NAME:-frontend-genashi-trial-${prefix}-01}"
            echo "loadbalancer_app_name=${LOADBALANCER_APP_NAME:-app-load-balancer-genashi-trial-${prefix}-01}"
            echo "function_chat_name=${FUNCTION_CHAT_NAME:-func-genashi-trial-${prefix}-01-chat}"
            echo "function_rag_name=${FUNCTION_RAG_NAME:-func-genashi-trial-${prefix}-02-rag}"
            echo "function_register_name=${FUNCTION_REGISTER_NAME:-func-genashi-trial-${prefix}-03-text-register}"
            echo "function_pii_name=${FUNCTION_PII_NAME:-func-genashi-trial-${prefix}-04-pii}"
            echo "function_prompt_name=${FUNCTION_PROMPT_NAME:-func-genashi-trial-${prefix}-05-prompt}"
            echo "function_pagesplitter_001_name=${FUNCTION_PAGESPLITTER_001_NAME:-func-genashi-trial-${prefix}-06-pagesplitter}"
            echo "function_markdown_001_name=${FUNCTION_MARKDOWN_001_NAME:-func-genashi-trial-${prefix}-07-markdown}"
            echo "function_pdf_name=${FUNCTION_PDF_NAME:-func-genashi-trial-${prefix}-08-pdf}"
            echo "function_mfg_name=${FUNCTION_MFG_NAME:-func-genashi-trial-${prefix}-09-mfg}"
            echo "function_agent_rag_name=${FUNCTION_AGENT_RAG_NAME:-func-genashi-trial-${prefix}-10-agent-rag}"
            echo "function_agent_document_name=${FUNCTION_AGENT_DOCUMENT_NAME:-func-genashi-trial-${prefix}-11-agent-document}"
            echo "function_pagesplitter_002_name=${FUNCTION_PAGESPLITTER_002_NAME:-func-genashi-trial-${prefix}-12-page-std}"
            echo "function_markdown_002_name=${FUNCTION_MARKDOWN_002_NAME:-func-genashi-trial-${prefix}-13-mark-std}"
            echo "function_indexer_name=${FUNCTION_INDEXER_NAME:-func-genashi-trial-${prefix}-14-indexer}"
          } >> "$GITHUB_OUTPUT"

  phase2_application:
    name: Phase 2 - Application Deploy
    needs: phase1_core
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: trial
    env:
      RESOURCE_GROUP: ${{ needs.phase1_core.outputs.resource_group }}
      STORAGE_ACCOUNT_NAME: ${{ needs.phase1_core.outputs.storage_account_name }}
      ACR_NAME: ${{ needs.phase1_core.outputs.acr_name }}
      FRONTEND_APP_NAME: ${{ needs.phase1_core.outputs.frontend_app_name }}
      LOADBALANCER_APP_NAME: ${{ needs.phase1_core.outputs.loadbalancer_app_name }}
      FUNCTION_CHAT_NAME: ${{ needs.phase1_core.outputs.function_chat_name }}
      FUNCTION_RAG_NAME: ${{ needs.phase1_core.outputs.function_rag_name }}
      FUNCTION_REGISTER_NAME: ${{ needs.phase1_core.outputs.function_register_name }}
      FUNCTION_PII_NAME: ${{ needs.phase1_core.outputs.function_pii_name }}
      FUNCTION_PROMPT_NAME: ${{ needs.phase1_core.outputs.function_prompt_name }}
      FUNCTION_MFG_NAME: ${{ needs.phase1_core.outputs.function_mfg_name }}
      FUNCTION_AGENT_RAG_NAME: ${{ needs.phase1_core.outputs.function_agent_rag_name }}
      FUNCTION_AGENT_DOCUMENT_NAME: ${{ needs.phase1_core.outputs.function_agent_document_name }}
      FUNCTION_PAGESPLITTER_001_NAME: ${{ needs.phase1_core.outputs.function_pagesplitter_001_name }}
      FUNCTION_MARKDOWN_001_NAME: ${{ needs.phase1_core.outputs.function_markdown_001_name }}
      FUNCTION_PDF_NAME: ${{ needs.phase1_core.outputs.function_pdf_name }}
      FUNCTION_PAGESPLITTER_002_NAME: ${{ needs.phase1_core.outputs.function_pagesplitter_002_name }}
      FUNCTION_MARKDOWN_002_NAME: ${{ needs.phase1_core.outputs.function_markdown_002_name }}
      FUNCTION_INDEXER_NAME: ${{ needs.phase1_core.outputs.function_indexer_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TRIALhs01_ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.TRIALhs01_ARM_TENANT_ID }}
          subscription-id: ${{ secrets.TRIALhs01_ARM_SUBSCRIPTION_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Phase 2-1 - Frontend build and deploy
        shell: bash
        run: |
          set -euo pipefail
          pushd original-beta/frontend
          npm install
          npm run format
          npm run lint
          npm run build

          rm -rf /tmp/frontend-staging
          mkdir -p /tmp/frontend-staging
          # standalone出力: server.js と最小限のnode_modulesを含む
          cp -r .next/standalone/. /tmp/frontend-staging/
          # static アセットを standalone 内の正しいパスへコピー
          mkdir -p /tmp/frontend-staging/.next/static
          cp -r .next/static/. /tmp/frontend-staging/.next/static/
          if [ -d public ]; then cp -r public /tmp/frontend-staging/public; fi

          pushd /tmp/frontend-staging
          zip -qr /tmp/frontend-deploy.zip .
          popd
          popd

          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP_NAME" \
            --src-path /tmp/frontend-deploy.zip \
            --type zip

      - name: Phase 2-2 - Load Balancer build and deploy
        shell: bash
        run: |
          set -euo pipefail
          pushd original-beta/loadbalancer/openai-aca-lb/src
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet publish --configuration Release --no-build --output ./publish
          pushd publish
          zip -qr ../publish.zip .
          popd
          popd

          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$LOADBALANCER_APP_NAME" \
            --src-path original-beta/loadbalancer/openai-aca-lb/src/publish.zip \
            --type zip

      - name: Phase 2-3 - Deploy Python Function Apps (13 apps except PDF)
        shell: bash
        run: |
          set -euo pipefail

          restore_storage_network() {
            az storage account update \
              --name "$STORAGE_ACCOUNT_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --default-action Deny >/dev/null 2>&1 || true
          }

          trap restore_storage_network EXIT

          az storage account update \
            --name "$STORAGE_ACCOUNT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --default-action Allow

          resolve_existing_path() {
            for candidate in "$@"; do
              if [ -d "$candidate" ]; then
                echo "$candidate"
                return 0
              fi
            done
            return 1
          }

          deploy_python_func() {
            local app_name="$1"
            shift
            local app_path
            app_path="$(resolve_existing_path "$@")" || {
              echo "No valid source directory found for ${app_name}. Candidates: $*" >&2
              return 1
            }
            echo "Deploying ${app_name} from ${app_path}"

            pushd "$app_path" >/dev/null
            rm -rf .python_packages
            python -m pip install -r requirements.txt -t .python_packages/lib/site-packages
            zip_path="/tmp/${app_name}.zip"
            rm -f "$zip_path"
            zip -qr "$zip_path" .
            popd >/dev/null

            az webapp deploy \
              --resource-group "$RESOURCE_GROUP" \
              --name "$app_name" \
              --src-path "$zip_path" \
              --type zip
          }

          deploy_python_func "$FUNCTION_CHAT_NAME" "original-beta/backend/orchestrator"
          deploy_python_func "$FUNCTION_RAG_NAME" "original-beta/backend/orchestrator-rag"
          deploy_python_func "$FUNCTION_REGISTER_NAME" "original-beta/backend/orchestrator-text-register"
          deploy_python_func "$FUNCTION_PII_NAME" "original-beta/backend/orchestrator-pii"
          deploy_python_func "$FUNCTION_PROMPT_NAME" "original-beta/backend/orchestrator-prompt"
          deploy_python_func "$FUNCTION_MFG_NAME" "original-beta/backend/orchestrator-mfg" "original-beta/changedoc/mfg"
          deploy_python_func "$FUNCTION_AGENT_RAG_NAME" "original-beta/backend/orchestrator-agent" "original-beta/changedoc/agent-rag"
          deploy_python_func "$FUNCTION_AGENT_DOCUMENT_NAME" "original-beta/backend/orchestrator-text-register" "original-beta/changedoc/agent-document"
          deploy_python_func "$FUNCTION_PAGESPLITTER_001_NAME" "original-beta/changedoc/pagesplitter"
          deploy_python_func "$FUNCTION_MARKDOWN_001_NAME" "original-beta/changedoc/markdown"
          deploy_python_func "$FUNCTION_PAGESPLITTER_002_NAME" "original-beta/changedoc_standard/pagesplitter" "original-beta/changedoc/pagesplitter"
          deploy_python_func "$FUNCTION_MARKDOWN_002_NAME" "original-beta/changedoc_standard/markdown" "original-beta/changedoc/markdown"
          deploy_python_func "$FUNCTION_INDEXER_NAME" "original-beta/changedoc_standard/indexer" "original-beta/changedoc/indexer"

      - name: Re-authenticate to Azure before ACR operations
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TRIALhs01_ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.TRIALhs01_ARM_TENANT_ID }}
          subscription-id: ${{ secrets.TRIALhs01_ARM_SUBSCRIPTION_ID }}

      - name: Phase 2-4 - Deploy PDF Function (container image)
        shell: bash
        run: |
          set -euo pipefail

          restore_storage_network() {
            az storage account update \
              --name "$STORAGE_ACCOUNT_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --default-action Deny >/dev/null 2>&1 || true
          }

          trap restore_storage_network EXIT

          az storage account update \
            --name "$STORAGE_ACCOUNT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --default-action Allow

          image_name="${ACR_NAME}.azurecr.io/convert-to-pdf:v1"

          az functionapp stop --name "$FUNCTION_PDF_NAME" --resource-group "$RESOURCE_GROUP"
          az acr login --name "$ACR_NAME"

          pushd original-beta/changedoc/converttopdf
          docker build --build-arg _PROXY="" -t "$image_name" -f Dockerfile .
          popd

          docker push "$image_name"

          az functionapp config container set \
            --name "$FUNCTION_PDF_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --docker-custom-image-name "$image_name" \
            --docker-registry-server-url "https://${ACR_NAME}.azurecr.io"

          az functionapp start --name "$FUNCTION_PDF_NAME" --resource-group "$RESOURCE_GROUP"
          echo "Waiting for PDF Function readiness before Phase 3..."
          for attempt in {1..60}; do
            app_state="$(az functionapp show --name "$FUNCTION_PDF_NAME" --resource-group "$RESOURCE_GROUP" --query state -o tsv 2>/dev/null || true)"
            if [ "$app_state" = "Running" ] && az functionapp keys list --name "$FUNCTION_PDF_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
              echo "PDF Function is ready."
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "WARNING: PDF Function did not become ready in time. Continuing to Phase 3." >&2
              break
            fi

            sleep 10
          done

  phase3_finalize:
    name: Phase 3 - Finalize Core
    needs:
      - phase1_core
      - phase2_application
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: trial
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TRIALhs01_ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.TRIALhs01_ARM_TENANT_ID }}
          subscription-id: ${{ secrets.TRIALhs01_ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Phase 3 - Terraform Apply (init_flag=false)
        working-directory: ${{ env.WORKDIR_CORE }}
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false -upgrade

          run_tf() {
            terraform plan \
              -input=false \
              -var="tenant_id=${ARM_TENANT_ID}" \
              -var="subscription_id=${ARM_SUBSCRIPTION_ID}" \
              -var="environment_prefix=${ENVIRONMENT_PREFIX}" \
              -var="frontend_auth_client_id=${FRONTEND_AUTH_CLIENT_ID}" \
              -var="frontend_auth_client_secret=${FRONTEND_AUTH_CLIENT_SECRET}" \
              -var="init_flag=false" \
              -out=tfplan-phase2 &&
            terraform apply -input=false tfplan-phase2
          }

          # Function App runtime の起動完了を待ってからplan実行（最大5回リトライ）
          for attempt in {1..5}; do
            if run_tf; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Terraform plan/apply failed after 5 attempts." >&2
              exit 1
            fi
            echo "Attempt $attempt failed (Function App runtime may still be initializing). Retrying in 60s..."
            sleep 60
          done

  phase4_restore:
    name: Phase 4 - Safety Restore
    needs:
      - phase1_core
      - phase2_application
      - phase3_finalize
    if: always() && needs.phase1_core.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: trial
    env:
      RESOURCE_GROUP: ${{ needs.phase1_core.outputs.resource_group }}
      STORAGE_ACCOUNT_NAME: ${{ needs.phase1_core.outputs.storage_account_name }}
    steps:
      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TRIALhs01_ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.TRIALhs01_ARM_TENANT_ID }}
          subscription-id: ${{ secrets.TRIALhs01_ARM_SUBSCRIPTION_ID }}

      - name: Phase 4 - Restore Storage network rule to Deny (safety)
        shell: bash
        run: |
          set -euo pipefail
          az storage account update \
            --name "$STORAGE_ACCOUNT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --default-action Deny || true

  phase5_verify:
    name: Phase 5 - Verify
    needs:
      - phase1_core
      - phase3_finalize
      - phase4_restore
    if: needs.phase3_finalize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: trial
    env:
      RESOURCE_GROUP: ${{ needs.phase1_core.outputs.resource_group }}
      FRONTEND_APP_NAME: ${{ needs.phase1_core.outputs.frontend_app_name }}
      LOADBALANCER_APP_NAME: ${{ needs.phase1_core.outputs.loadbalancer_app_name }}
    steps:
      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TRIALhs01_ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.TRIALhs01_ARM_TENANT_ID }}
          subscription-id: ${{ secrets.TRIALhs01_ARM_SUBSCRIPTION_ID }}

      - name: Phase 5 - Verify app states
        shell: bash
        run: |
          set -euo pipefail
          az webapp show --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_APP_NAME" --query "{name:name,state:state,defaultHostName:defaultHostName}" -o table
          az webapp show --resource-group "$RESOURCE_GROUP" --name "$LOADBALANCER_APP_NAME" --query "{name:name,state:state,defaultHostName:defaultHostName}" -o table
          az functionapp list --resource-group "$RESOURCE_GROUP" --query "[].{name:name,state:state,host:defaultHostName}" -o table